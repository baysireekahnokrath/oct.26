<title>OCT. 26 Web Directions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500&family=IBM+Plex+Sans+Thai:wght@400;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Six directions, one content set. Brand Book v2 (22 Oct 2026): cotton ground, charcoal type, hide and teak for leather,
   the five family colours only as small hidden details. One committed light look, like every printed piece. */
:root{
  --cotton:#F4F0E8;--paper:#FBF9F4;--charcoal:#2A2725;--muted:#6E6A64;--stone:#8C8A85;--line:#DCD4C7;
  --hide:#B07A4A;--teak:#8B5E3C;--hide-l:#E6D6C1;--stone-l:#DEDAD2;
  --dad:#A9442B;--mom:#5E7A3A;--beiya:#E9A825;--beana:#B9A3D6;--bene:#2E4A7D;
  --s1:5px;--s2:8px;--s3:13px;--s4:21px;--s5:34px;--s6:55px;--s7:89px;
  --th:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --latin:"Jost","IBM Plex Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cotton);color:var(--charcoal);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 var(--s6);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--charcoal)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--th);font-weight:500;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,9vw,58px)}h2{font-size:clamp(26px,6vw,38px)}h3{font-size:19px}
p{margin:0}a{color:inherit}
.full{margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto}
.eyebrow{font-family:var(--latin);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:18px;color:var(--muted);max-width:60ch}
.cap{font-size:14px;color:var(--muted)}
.latin{font-family:var(--latin)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.sec{padding-block:var(--s7) 0;display:flex;flex-direction:column;gap:var(--s4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:46px;padding:var(--s2) var(--s4);border-radius:0;
  font-family:var(--th);font-size:15px;text-decoration:none;border:1px solid var(--charcoal);background:transparent;color:var(--charcoal);cursor:pointer}
.btn.dark{background:var(--charcoal);color:var(--cotton)}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--bene);outline-offset:2px}
button{font:inherit;color:inherit}
.band{display:flex;height:6px;width:100%}.band span{flex:1}
.lg{display:block;width:72px;height:auto}

#view [id]{scroll-margin-top:120px}
.sum{display:flex;flex-direction:column;gap:var(--s4);padding-block:var(--s5)}
.sum table{border-collapse:collapse;width:100%;font-size:14px}.sum th,.sum td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sum .tw{overflow-x:auto}
/* switcher */
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--charcoal);color:var(--cotton);padding-block:var(--s2)}
.switch .in{display:flex;flex-direction:column;gap:6px}
.switch .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.switch a{flex:none;text-decoration:none;font-family:var(--th);font-size:14px;padding:6px 12px;border:1px solid #5A5550;color:var(--cotton);white-space:nowrap}
.switch a[aria-current="page"]{background:var(--cotton);color:var(--charcoal);border-color:var(--cotton)}
.switch .what{font-size:13px;color:#CFC8BD;display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:space-between}
.fit i{display:inline-block;width:8px;height:8px;margin-left:3px;background:#5A5550}.fit i.on{background:var(--beiya)}

/* site header inside each mock */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-block:var(--s3)}
.mhead nav{display:flex;gap:var(--s3);overflow-x:auto;scrollbar-width:none;font-family:var(--th);font-size:14px}
.mhead nav a{text-decoration:none;flex:none}
.mhead .lg{width:52px}

/* parallax */
.px{position:absolute;will-change:transform;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(42,39,37,.22))}
@media (prefers-reduced-motion:reduce){.px{will-change:auto}html{scroll-behavior:auto}}

/* booth strip */
.booth{border:1px solid var(--charcoal);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;font-size:15px}
.booth b{font-family:var(--th);font-weight:500}

/* simulator */
.sim{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.sim{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}}
.sim-stage{position:relative;aspect-ratio:1/1;max-width:100%;background:radial-gradient(60% 50% at 50% 58%,#E9E2D6 0%,var(--cotton) 70%);touch-action:pan-y;cursor:grab}
.sim-stage canvas,.sim-stage svg{position:absolute;inset:0;width:100%;height:100%}
.sim-stage .hint{position:absolute;left:var(--s3);bottom:var(--s3);font-size:12px;color:var(--muted);font-family:var(--latin);letter-spacing:.1em;text-transform:uppercase}
.sim-ui{display:flex;flex-direction:column;gap:var(--s3)}
.sim-ui .lbl{font-family:var(--latin);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pchips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pchips button{border:1px solid var(--line);background:var(--paper);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
.pchips button svg{width:30px;height:30px}
.pchips button span{font-family:var(--latin);font-size:13px}
.pchips button[aria-pressed="true"]{border-color:var(--charcoal);background:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:40px;height:40px;border-radius:50%;border:2px solid var(--cotton);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--charcoal)}
.sim-info{font-family:var(--th);font-size:18px}

/* product cards (base) */
.shop{display:grid;gap:var(--s4) var(--s3);grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:820px){.shop{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{min-width:0;display:flex;flex-direction:column;gap:6px}
.card .media{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--hide-l);display:flex;align-items:center;justify-content:center}
.card .media>img{width:100%;height:100%;object-fit:cover}
.card .media .cut{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(42,39,37,.25))}
.card .media.mx{display:grid;grid-template-columns:1fr 1fr;gap:4%;padding:10%}
.card .media.mx img,.card .media.mx svg{width:100%;height:100%;object-fit:contain}
.card h3{font-size:16px}
.card .spec{font-size:13px;color:var(--muted)}
.card .food{font-size:12px;color:var(--muted)}
.card .price{font-family:var(--latin);font-size:18px;font-weight:500}
.card .buy{font-size:14px;text-decoration:none;border-bottom:1px solid currentColor;align-self:flex-start}
.note02{position:absolute;left:6px;bottom:6px;font-size:11px;background:var(--cotton);padding:2px 6px;color:var(--muted)}

/* corporate + workshop */
.split{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ticks li{padding-left:20px;position:relative}.ticks li::before{content:"";position:absolute;left:0;top:.7em;width:10px;height:1px;background:var(--charcoal)}
.steps{display:grid;gap:var(--s2);grid-template-columns:repeat(3,minmax(0,1fr));counter-reset:s}
.steps div{border-top:1px solid var(--charcoal);padding-top:var(--s2);font-size:14px;counter-increment:s}
.steps div::before{content:"0" counter(s);display:block;font-family:var(--latin);font-size:22px;font-weight:300}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input{font:inherit;font-size:16px;color:var(--charcoal);background:var(--paper);border:1px solid var(--line);border-radius:0;padding:var(--s2) var(--s3);min-height:46px;width:100%}
.ncard{width:100%;max-width:360px;aspect-ratio:89/55;background:var(--paper);box-shadow:0 2px 10px rgba(42,39,37,.15);display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);position:relative;overflow:hidden}
.ncard .lg{width:46px}
.ncard b{font-family:var(--th);font-weight:500;font-size:18px;display:block;overflow-wrap:anywhere}
.ncard small{font-size:12px;color:var(--muted)}
.ncard .band{position:absolute;left:0;right:0;bottom:0;height:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--paper);padding:6px 12px;min-height:40px;cursor:pointer;font-family:var(--th);font-size:14px}
.opts button[aria-pressed="true"]{border-color:var(--charcoal);background:var(--charcoal);color:var(--cotton)}
.stepper{display:flex;align-items:center;gap:var(--s2)}
.stepper button{width:44px;height:44px;border:1px solid var(--charcoal);background:transparent;font-size:20px;cursor:pointer}
.stepper output{font-family:var(--latin);font-size:22px;min-width:3ch;text-align:center}
.mocknote{font-size:12px;color:var(--muted);border-left:3px solid var(--beiya);padding-left:var(--s2)}

/* footer */
.mfoot{margin-top:var(--s7);padding-block:var(--s5);border-top:1px solid var(--charcoal);display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.mfoot{grid-template-columns:auto 1fr 1fr 1fr}}
.mfoot .col{display:flex;flex-direction:column;gap:4px;font-size:14px}
.mfoot .col b{font-family:var(--latin);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400}
.mfoot a{text-decoration:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--charcoal);color:var(--cotton);
  font-family:var(--th);font-size:14px;padding:var(--s2) var(--s4);max-width:calc(100% - 32px)}

/* ---------- D1 สมุดภาพ (Spring) ---------- */
.d1 .hero{position:relative;min-height:min(92vh,760px);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.d1 .hero .blob{position:absolute;border-radius:50%;filter:blur(28px);opacity:.28}
.d1 .hero .t{position:relative;z-index:2;display:flex;flex-direction:column;gap:var(--s3);align-items:center;max-width:24ch}
.d1 .hero h1{font-size:clamp(40px,12vw,84px);line-height:1.1}
.d1 .chapter{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s4);align-items:center;padding:var(--s5) var(--s4);background:var(--paper);margin-top:var(--s7);box-shadow:0 6px 24px rgba(42,39,37,.08)}
.d1 .chapter img{width:96px;height:96px;object-fit:contain}
.d1 .chapter .part{font-family:var(--latin);font-weight:300;font-size:clamp(28px,7vw,44px);letter-spacing:.02em}
.d1 .sec{padding-top:var(--s5)}
.d1 .card .media{background:var(--paper)}

/* ---------- D2 ไม่ซ้ำสักชิ้น (faces) ---------- */
.d2 .faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,2vw,18px);padding-block:var(--s5)}
.d2 .faces button{border:0;background:none;padding:0;aspect-ratio:1/1;cursor:pointer}
.d2 .faces img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(42,39,37,.22));transition:transform .25s}
.d2 .faces button:hover img,.d2 .faces button.on img{transform:scale(1.12) rotate(-6deg)}
.d2 .hero-t{display:flex;flex-direction:column;gap:var(--s3);text-align:center;align-items:center}
.d2 .who{display:flex;gap:var(--s4);flex-wrap:wrap}
.d2 .who div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);width:64px;text-align:center}
.d2 .who span{width:44px;height:44px;border-radius:50%}
.d2 .card .media{background:transparent}
.d2 .shop{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:820px){.d2 .shop{grid-template-columns:repeat(4,minmax(0,1fr))}}
.d2 .card{text-align:center;align-items:center}.d2 .card .buy{align-self:center}

/* ---------- D3 บทความ (Originality) ---------- */
.d3 .hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:var(--s3);padding-block:var(--s5) var(--s6);min-height:620px}
.d3 .hero .left{display:flex;flex-direction:column;justify-content:space-between;gap:var(--s5);position:relative;z-index:2}
.d3 .hero .small{font-family:var(--latin);font-size:14px;line-height:1.4;max-width:22ch}
.d3 .hero .vert{writing-mode:vertical-rl;font-family:var(--latin);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:15px;justify-self:end}
.d3 .hero .big{font-family:var(--latin);font-weight:500;font-size:clamp(34px,10vw,76px);letter-spacing:.04em;line-height:1;text-transform:uppercase}
.d3 .hero .acc{width:44px;height:28px;background:var(--bene)}
.d3 .hero .px{width:min(70vw,460px);right:8%;top:16%}
.d3 .partno{display:flex;align-items:baseline;gap:var(--s2);font-family:var(--latin)}
.d3 .partno span{font-size:14px;font-weight:500}.d3 .partno b{font-size:clamp(54px,14vw,96px);font-weight:500;line-height:.9}
.d3 .ed{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:820px){.d3 .ed{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.d3 .ed.rev>:first-child{order:2}}
.d3 .ed .ph{aspect-ratio:4/5;overflow:hidden;background:var(--hide-l)}.d3 .ed .ph img{width:100%;height:100%;object-fit:cover}
.d3 .shop{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
@media (min-width:820px){.d3 .shop{grid-template-columns:repeat(2,minmax(0,1fr))}}
.d3 .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s3);align-items:end}
.d3 .card .media{grid-row:span 6;aspect-ratio:3/4}
.d3 .card .no{font-family:var(--latin);font-size:42px;font-weight:500;line-height:1}
.d3 .sq{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:middle}

/* ---------- D4 ขอบหยัก (Cupful of Joy) ---------- */
.d4 .hero{position:relative;background:var(--hide-l);padding-block:var(--s6) 120px;text-align:center;overflow:hidden}
.d4 .scal{position:relative}
.d4 .scal::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;
  background:radial-gradient(circle at 14px 0,transparent 13px,var(--cotton) 14px) repeat-x;background-size:28px 28px}
.d4 .hero h1{font-size:clamp(40px,11vw,76px);line-height:1.08}
.d4 .hero .doodle{position:absolute;opacity:.75}
.d4 .hero .row{justify-content:center}
.d4 .hero .seat{position:absolute;bottom:18px;width:30%;max-width:220px}
.d4 .ttl{text-align:center;align-items:center}
.d4 .card{background:var(--paper);padding:var(--s3);border-radius:28px;align-items:center;text-align:center}
.d4 .card .media{background:none;aspect-ratio:1/1;width:100%}
.d4 .card .media .shaped{width:88%;height:88%}
.d4 .card .pill{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.d4 .card .buy{border:0;background:var(--charcoal);color:var(--cotton);padding:4px 14px;border-radius:99px;font-size:13px}
.d4 .about{position:relative;max-width:560px;margin:0 auto;width:100%}
.d4 .about img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:36px}
.d4 .bub{position:absolute;background:var(--paper);border-radius:22px;padding:8px 14px;font-size:14px;max-width:62%;box-shadow:0 6px 16px rgba(42,39,37,.15)}
.d4 .sec{background:var(--cotton)}
.d4 .wave{background:var(--paper);border-radius:40px;padding:var(--s5) var(--s4)}

/* ---------- D5 แคตตาล็อก (Rayo) ---------- */
.d5 .mhead nav{background:var(--paper);border-radius:99px;padding:4px}
.d5 .mhead nav a{padding:4px 12px;border-radius:99px}.d5 .mhead nav a.on{background:var(--charcoal);color:var(--cotton)}
.d5 .hero{text-align:center;padding-block:var(--s6) var(--s4);display:flex;flex-direction:column;gap:var(--s3);align-items:center}
.d5 .hero h1{font-size:clamp(34px,8.5vw,62px)}
.d5 .search{width:min(100%,360px);border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 16px;font-size:14px;color:var(--muted);text-align:left}
.d5 .filters{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap;width:100%}
.d5 .filters .opts button{border-radius:99px}
.d5 .card .media{border-radius:14px;background:var(--t,var(--stone-l))}
.d5 .card .media .cut{width:66%;height:66%}
.d5 .card .dot{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center}
.d5 .card .dot i{width:10px;height:10px;border-radius:50%}
.d5 .card .row{justify-content:space-between}
.d5 .card .buy{border:0;background:var(--charcoal);color:var(--cotton);border-radius:99px;padding:4px 12px;font-size:13px}
.d5 .bigfoot{background:var(--charcoal);color:var(--cotton);border-radius:22px;padding:var(--s5) var(--s4);margin-top:var(--s7);display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.d5 .bigfoot{grid-template-columns:1.3fr 1fr 1fr 1fr}}
.d5 .bigfoot .lg{width:84px}.d5 .bigfoot .col b{color:#B8B1A6}.d5 .mfoot{display:none}

/* ---------- D6 หน้าต่างแพตเทิร์น (Markaworks) ---------- */
.d6 .grid12{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.6vw,14px);padding-block:var(--s5)}
.d6 .tile{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:var(--c,var(--hide))}
.d6 .tile .ph{position:absolute;inset:-12% 0;width:100%;height:124%;object-fit:cover}
.d6 .tile svg.win{position:absolute;inset:0;width:100%;height:100%}
.d6 .tile .tag{position:absolute;left:10px;top:8px;font-family:var(--latin);font-size:10px;letter-spacing:.14em;color:var(--fg,var(--cotton));text-transform:uppercase}
.d6 .tile .hex{position:absolute;left:10px;bottom:8px;font-family:var(--latin);font-size:10px;color:var(--fg,var(--cotton))}
.d6 .tile .cutp{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.d6 .ttl{text-align:center;align-items:center}
.d6 .card{background:#fff;padding:0;box-shadow:0 2px 8px rgba(42,39,37,.12)}
.d6 .card .media{aspect-ratio:1/1;background:var(--t,var(--hide-l))}
.d6 .card .lab{padding:var(--s2) var(--s3) var(--s3);display:flex;flex-direction:column;gap:2px}
.d6 .card .code{font-family:var(--latin);font-size:11px;letter-spacing:.14em;font-weight:500}
.d6 .swatches button{border-radius:6px;width:46px;height:58px}
</style>
<div class="switch full"><div class="in">
<div class="tabs" role="tablist" aria-label="เลือกแบบ" id="tabs"></div>
<div class="what"><span id="what"></span><span class="fit" id="fit"></span></div></div></div>
<main id="view"></main>
<div class="toast" id="toast" role="status" hidden></div>

/* ---------- die shapes ---------- */
function pathD(code){ const s=SH[code]; return [s.outline,...s.holes].map(p=>"M"+p.map(q=>q[0]+" "+q[1]).join("L")+"Z").join(""); }
function sil(code, fill, opts={}){
  const s=SH[code], sw=opts.stroke?`stroke="${opts.stroke}" stroke-width="${opts.sw||1}" vector-effect="non-scaling-stroke"`:"";
  const slits = opts.slits===false?"":s.slits.map(l=>`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${opts.slit||"rgba(0,0,0,.45)"}" stroke-width="${opts.sw||1}" vector-effect="non-scaling-stroke"/>`).join("");
  return `<svg viewBox="0 0 ${s.w} ${s.h}" aria-hidden="true" class="${opts.cls||""}"><path d="${pathD(code)}" fill="${fill}" fill-rule="evenodd" ${sw}/>${slits}</svg>`;
}
// normalised path for clipPath objectBoundingBox
function clipD(code){ const s=SH[code]; return "M"+s.outline.map(p=>(p[0]/s.w).toFixed(4)+" "+(p[1]/s.h).toFixed(4)).join("L")+"Z"; }

function noiseTex(){
  const c=document.createElement("canvas"); c.width=c.height=256; const g=c.getContext("2d"), d=g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){ const v=128+(Math.random()-.5)*90; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  g.putImageData(d,0,0); g.globalAlpha=.08;
  for(let k=0;k<180;k++){ g.fillStyle=Math.random()<.5?"#000":"#fff"; g.beginPath(); g.ellipse(Math.random()*256,Math.random()*256,4+Math.random()*16,2+Math.random()*8,Math.random()*3,0,7); g.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1/45,1/45); return t;
}
// soft mottling multiplied into the leather colour: scraps are never one flat tone
function mottleTex(){
  const c=document.createElement("canvas"); c.width=c.height=512; const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,512,512);
  for(let k=0;k<260;k++){ const x=Math.random()*512,y=Math.random()*512,r=10+Math.random()*60, v=200+Math.random()*55|0;
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${v},${v},${v},.35)`); gr.addColorStop(1,"rgba(255,255,255,0)"); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); }
  const d=g.getImageData(0,0,512,512); for(let i=0;i<d.data.length;i+=4){ const n=(Math.random()-.5)*26; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n; } g.putImageData(d,0,0);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1/70,1/70); return t;
}
function buildMesh(){
  const T=S.three, s=SH[S.code], cx=s.w/2, cy=s.h/2;
  if(T.mesh){ T.group.remove(T.mesh); T.mesh.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  const shp=new THREE.Shape(s.outline.map(p=>new THREE.Vector2(p[0]-cx, cy-p[1])));
  s.holes.forEach(h=>shp.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0]-cx, cy-p[1])))));
  const depth=1.2, g=new THREE.ExtrudeGeometry(shp,{depth,bevelEnabled:true,bevelThickness:.18,bevelSize:.18,bevelSegments:2,curveSegments:6});
  g.translate(0,0,-depth/2);
  const m=new THREE.Mesh(g,[T.top,T.edge]);
  const slitMat=new THREE.MeshBasicMaterial({color:0x1a1513});
  s.slits.forEach(l=>{ const x1=l[0]-cx,y1=cy-l[1],x2=l[2]-cx,y2=cy-l[3], len=Math.hypot(x2-x1,y2-y1);
    const b=new THREE.Mesh(new THREE.BoxGeometry(len,.55,depth+.5),slitMat); b.position.set((x1+x2)/2,(y1+y2)/2,0); b.rotation.z=Math.atan2(y2-y1,x2-x1); m.add(b); });
  T.mesh=m; T.group.add(m); setColor();
}
// raw edge, never painted: a little lighter and drier than the grain side
function setColor(){ const T=S.three; if(!T) return; const c=new THREE.Color(LEATHER[S.leather][1]).convertSRGBToLinear();

function flat(){ const f=$("#flat",simEl); f.hidden=false; f.innerHTML=sil(S.code,LEATHER[S.leather][1],{slit:"rgba(0,0,0,.5)"}); f.firstChild.style.cssText="position:absolute;inset:14%;width:72%;height:72%"; $("#simc",simEl).hidden=true; }
function initThree(){

  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1,1,2000); cam.position.set(0,-120,190); cam.lookAt(0,0,0);
  scene.add(new THREE.HemisphereLight(0xfff3e2,0x5a4c40,.55));
  const dl=new THREE.DirectionalLight(0xffffff,.75); dl.position.set(-90,-40,150); scene.add(dl);
  const rim=new THREE.DirectionalLight(0xffe2c4,.45); rim.position.set(120,140,40); scene.add(rim);
  const tex=noiseTex();

  const edge=new THREE.MeshStandardMaterial({roughness:.95,metalness:0,bumpMap:tex,bumpScale:.3});
  const group=new THREE.Group(); scene.add(group);
  S.three={r,scene,cam,group,top,edge,mesh:null,rx:-.55,ry:.5,drag:null,visible:false};
  buildMesh();
  const stage=$("#stage",simEl);
  const size=()=>{ const w=stage.clientWidth||300; r.setSize(w,w,false); cam.aspect=1; cam.updateProjectionMatrix(); };
  size(); new ResizeObserver(size).observe(stage);
  stage.addEventListener("pointerdown",e=>{ S.three.drag={x:e.clientX,y:e.clientY,rx:S.three.rx,ry:S.three.ry}; stage.setPointerCapture(e.pointerId); stage.style.cursor="grabbing"; });
  stage.addEventListener("pointermove",e=>{ const d=S.three.drag; if(!d) return; S.three.ry=d.ry+(e.clientX-d.x)*.01; S.three.rx=Math.max(-1.4,Math.min(1.2,d.rx+(e.clientY-d.y)*.01)); });
  const up=()=>{ S.three.drag=null; stage.style.cursor=""; }; stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
  new IntersectionObserver(es=>{ S.three.visible=es[0].isIntersecting; }).observe(stage);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function loop(){ requestAnimationFrame(loop); const T=S.three; if(!T.visible) return;
    if(!T.drag && !still) T.ry+=.006; T.group.rotation.set(T.rx,0,0); T.mesh.rotation.set(0,0,T.ry); T.r.render(T.scene,T.cam); })();
}
simEl.addEventListener("click",e=>{
  const p=e.target.closest("[data-code]"); if(p){ S.code=p.dataset.code; simEl.querySelectorAll("[data-code]").forEach(b=>b.setAttribute("aria-pressed",String(b===p))); S.three?buildMesh():S.three===false&&flat(); simText(); }
  const w=e.target.closest("[data-i]"); if(w){ S.leather=+w.dataset.i; simEl.querySelectorAll("[data-i]").forEach(b=>b.setAttribute("aria-pressed",String(b===w))); S.three?setColor():S.three===false&&flat(); simText(); }
});

/* ---------- page wiring ---------- */
function parallax(){
  const vh=innerHeight;
  document.querySelectorAll("#view [data-depth]").forEach(el=>{ const host=el.dataset.in?el.parentElement:el.parentElement;
    const r=host.getBoundingClientRect(); if(r.bottom<-200||r.top>vh+200) return;
    const off=(r.top+r.height/2-vh/2)*-(+el.dataset.depth); el.style.transform=`translate3d(0,${off.toFixed(1)}px,0) rotate(${el.dataset.rot||0}deg)`; });
}
let ticking=false; addEventListener("scroll",()=>{ if(!ticking){ ticking=true; requestAnimationFrame(()=>{ parallax(); ticking=false; }); } },{passive:true});
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;

function show(id, keepScroll){
  if(id==="sum"){ $("#view").className="sumv"; $("#view").innerHTML=sum(); document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.id==="sum"?"page":"false"));
    $("#what").textContent="สรุปงาน สิ่งที่ต้องเช็ก และไฟล์"; $("#fit").innerHTML=""; if(!keepScroll) scrollTo(0,0); return; }
  const d=DIRS.find(x=>x.id===id)||DIRS[0];
  $("#view").className=d.id; $("#view").innerHTML=RENDER[d.id]();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.id===d.id?"page":"false"));
  $("#what").textContent=`แบบ ${d.id.slice(1)} ${d.name} (ref ${d.ref}) · ${d.what}`;
  $("#fit").innerHTML=`เข้ากับ Brand Book v2 ${[1,2,3,4,5].map(i=>`<i class="${i<=d.fit?"on":""}"></i>`).join("")}`;
  $(".sim-slot").appendChild(simEl); simText();
  if(!keepScroll) scrollTo(0,0);
  if(!still) parallax(); else document.querySelectorAll("#view [data-depth]").forEach(el=>el.style.transform=`rotate(${el.dataset.rot||0}deg)`);
  new IntersectionObserver((es,o)=>{ if(es[0].isIntersecting){ initThree(); o.disconnect(); } },{rootMargin:"300px"}).observe(simEl);
}
$("#tabs").innerHTML=DIRS.map(d=>`<a href="#${d.id}" data-id="${d.id}" role="tab">${d.id.slice(1)} · ${d.name}</a>`).join("")+`<a href="#sum" data-id="sum" role="tab">สรุป</a>`;
document.addEventListener("click",e=>{
  const t=e.target.closest("#tabs a"); if(t){ e.preventDefault(); history.replaceState(null,"","#"+t.dataset.id); show(t.dataset.id); return; }
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); history.replaceState(null,"","#"+g.dataset.go); show(g.dataset.go); return; }
  const a=e.target.closest('#view a[href^="#"]'); if(a){ e.preventDefault(); const el=document.getElementById(a.getAttribute("href").slice(1)); if(el) el.scrollIntoView({behavior:still?"auto":"smooth"}); return; }
  const c=e.target.closest("[data-copy]"); if(c&&c.dataset.copy){ try{ navigator.clipboard.writeText(c.dataset.copy).then(()=>toast("คัดลอกข้อความแล้ว วางในแชท LINE ได้เลย"),()=>{}); }catch(_){} }
  const f=e.target.closest(".faces button"); if(f){ document.querySelectorAll(".faces button.on").forEach(b=>b.classList.remove("on")); f.classList.add("on"); const l=$("#faceLab"); if(l) l.textContent=f.dataset.lab+" · ชิ้นนี้มีชิ้นเดียว"; }
  const o=e.target.closest("[data-one] button"); if(o){ o.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===o))); }
  const st=e.target.closest("[data-st]"); if(st){ const out=st.parentElement.querySelector("output"); out.textContent=Math.max(2,Math.min(60,+out.textContent+ +st.dataset.st)); }
  const fl=e.target.closest("[data-filter] button"); if(fl){ fl.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===fl)));
    document.querySelectorAll("#view .card[data-kind]").forEach(cd=>cd.hidden=fl.dataset.k!=="all"&&cd.dataset.kind!==fl.dataset.k); }
});
document.addEventListener("input",e=>{ if(e.target.id==="org") document.querySelectorAll("[data-org]").forEach(b=>b.textContent=e.target.value.trim()||"บริษัทของคุณ"); });
document.addEventListener("submit",e=>{ if(e.target.matches("[data-book]")){ e.preventDefault(); toast("mock: เว็บจริงจะส่งคำขอนี้ต่อไป LINE ของร้าน"); } });
show((location.hash.match(/^#(d[1-6]|sum)$/)||[])[1]||"d1", true);
</script>
