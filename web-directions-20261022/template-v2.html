<title>OCT. 26 Web Directions Color</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500&family=IBM+Plex+Sans+Thai:wght@400;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Round 2, colourful (owner, 22 Oct): every section takes one of the five family colours, light or full, with a craft
   texture (saddle stitch, punch holes, gingham, die-shape stamps, paper grain). Pieces carry painted faces as DIY
   examples. Same content and fonts as round 1. One committed light world, every colour set explicitly. */
:root{
  --cotton:#F4F0E8;--paper:#FBF9F4;--charcoal:#2A2725;--stone:#8C8A85;--line:#DCD4C7;--hide:#B07A4A;--teak:#8B5E3C;
  --dad:#A9442B;--mom:#5E7A3A;--beiya:#E9A825;--beana:#B9A3D6;--bene:#2E4A7D;
  --dad-l:#EFC9BC;--mom-l:#D4DFC1;--beiya-l:#F8E2A6;--beana-l:#E6DDF2;--bene-l:#C9D4E8;--hide-l:#E8D6BF;
  --s1:5px;--s2:8px;--s3:13px;--s4:21px;--s5:34px;--s6:55px;--s7:89px;
  --th:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --latin:"Jost","IBM Plex Sans Thai",system-ui,sans-serif;
  --sbg:var(--cotton);--fg:var(--charcoal);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cotton);color:var(--charcoal);font-family:var(--body);font-size:16px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--charcoal)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--th);font-weight:500;line-height:1.22;margin:0;text-wrap:balance}
h1{font-size:clamp(36px,10vw,64px)}h2{font-size:clamp(28px,6.4vw,42px)}h3{font-size:18px}
p{margin:0}a{color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto}
.eyebrow{font-family:var(--latin);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.lead{font-size:18px;max-width:60ch;opacity:.86}
.cap{font-size:14px;opacity:.78}
.latin{font-family:var(--latin)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:46px;padding:var(--s2) var(--s4);border-radius:99px;
  font-family:var(--th);font-size:15px;text-decoration:none;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.btn.solid{background:var(--fg);color:var(--sbg);border-color:var(--fg)}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--beiya);outline-offset:2px}
button{font:inherit;color:inherit}
.band{display:flex;height:6px;width:100%}.band span{flex:1}
.lg{display:block;width:72px;height:auto}

/* ----- section colour + craft textures ----- */
.sec{position:relative;background:var(--sbg);color:var(--fg);padding-block:var(--s7);isolation:isolate}
.sec>.in{position:relative;z-index:2;display:flex;flex-direction:column;gap:var(--s4)}
.bg-cotton{--sbg:var(--cotton);--fg:var(--charcoal)}
.bg-paper{--sbg:var(--paper);--fg:var(--charcoal)}
.bg-charcoal{--sbg:var(--charcoal);--fg:var(--cotton)}
.bg-dad{--sbg:var(--dad);--fg:var(--cotton)}.bg-mom{--sbg:var(--mom);--fg:var(--cotton)}.bg-bene{--sbg:var(--bene);--fg:var(--cotton)}
.bg-beiya{--sbg:var(--beiya);--fg:var(--charcoal)}.bg-beana{--sbg:var(--beana);--fg:var(--charcoal)}.bg-hide{--sbg:var(--hide);--fg:var(--cotton)}
.bg-teak{--sbg:var(--teak);--fg:var(--cotton)}
.bg-dad-l{--sbg:var(--dad-l);--fg:var(--charcoal)}.bg-mom-l{--sbg:var(--mom-l);--fg:var(--charcoal)}.bg-beiya-l{--sbg:var(--beiya-l);--fg:var(--charcoal)}
.bg-beana-l{--sbg:var(--beana-l);--fg:var(--charcoal)}.bg-bene-l{--sbg:var(--bene-l);--fg:var(--charcoal)}.bg-hide-l{--sbg:var(--hide-l);--fg:var(--charcoal)}
/* paper/leather grain on every coloured band */
.sec::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:var(--grain);opacity:.22;mix-blend-mode:multiply}
/* saddle stitch: two dashed rows inside the band edge, like hand-stitched leather */
.stitch>.in::before,.stitch>.in::after{content:"";position:absolute;left:-6px;right:-6px;height:2px;
  background:repeating-linear-gradient(90deg,var(--fg) 0 11px,transparent 11px 19px);opacity:.55}
.stitch>.in::before{top:-20px}.stitch>.in::after{bottom:-20px}
.p-dots{background-image:radial-gradient(circle,color-mix(in srgb,var(--fg) 16%,transparent) 3px,transparent 3.5px);background-size:26px 26px}
.p-ging{background-image:linear-gradient(90deg,color-mix(in srgb,var(--fg) 10%,transparent) 50%,transparent 50%),linear-gradient(color-mix(in srgb,var(--fg) 10%,transparent) 50%,transparent 50%);background-size:36px 36px}
.p-stripe{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--fg) 9%,transparent) 0 14px,transparent 14px 28px)}
.p-stamp{background-image:var(--stamp);background-size:150px 150px}
.scal::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;z-index:3;
  background:radial-gradient(circle at 16px 0,var(--sbg) 15px,transparent 16px) repeat-x;background-size:32px 16px}

/* switcher */
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--charcoal);color:var(--cotton);padding-block:var(--s2)}
.switch .in{display:flex;flex-direction:column;gap:6px}
.switch .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.switch a{flex:none;text-decoration:none;font-family:var(--th);font-size:14px;padding:6px 12px;border-radius:99px;border:1px solid #5A5550;color:var(--cotton);white-space:nowrap}
.switch a[aria-current="page"]{background:var(--beiya);color:var(--charcoal);border-color:var(--beiya)}
.switch .what{font-size:13px;color:#CFC8BD}
#view [id]{scroll-margin-top:110px}

/* site header */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-block:var(--s3);position:relative;z-index:5}
.mhead nav{display:flex;gap:var(--s3);overflow-x:auto;scrollbar-width:none;font-family:var(--th);font-size:14px}
.mhead nav a{text-decoration:none;flex:none}
.mhead .lg{width:52px}

/* pieces with painted faces */
.pc{position:relative;display:block}
.pc>img{width:100%;height:auto;filter:drop-shadow(0 10px 12px rgba(42,39,37,.28))}
.pc>svg.face{position:absolute;transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.px{position:absolute;will-change:transform;pointer-events:none}
@media (prefers-reduced-motion:reduce){.px{will-change:auto}html{scroll-behavior:auto}}
.blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.55;z-index:1;pointer-events:none}

/* booth strip */
.booth{border:2px dashed currentColor;border-radius:18px;padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px;font-size:15px}
.booth b{font-family:var(--th);font-weight:500;font-size:17px}

/* simulator */
.sim{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.sim{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}}
.sim-stage{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:28px;overflow:hidden;
  background:radial-gradient(60% 50% at 50% 58%,#FFFFFF 0%,var(--cotton) 72%);touch-action:pan-y;cursor:grab;box-shadow:0 10px 30px rgba(42,39,37,.18)}
.sim-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.sim-stage .hint{position:absolute;left:var(--s4);bottom:var(--s3);font-size:12px;color:#6E6A64;font-family:var(--latin);letter-spacing:.1em;text-transform:uppercase}
.sim-stage #flat{position:absolute;inset:14%}
.sim-ui{display:flex;flex-direction:column;gap:var(--s3)}
.sim-ui .lbl{font-family:var(--latin);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.pchips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pchips button,.fchips button{border:2px solid transparent;background:color-mix(in srgb,var(--fg) 12%,transparent);border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
.pchips button svg{width:30px;height:30px}
.pchips button span,.fchips button span{font-family:var(--latin);font-size:12px}
.pchips button[aria-pressed="true"],.fchips button[aria-pressed="true"]{border-color:var(--fg);background:color-mix(in srgb,var(--fg) 22%,transparent)}
.fchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.fchips button svg{width:30px;height:30px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid var(--sbg);box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 40%,transparent);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--fg)}
.swatches.ink button{width:32px;height:32px}
.sim-info{font-family:var(--th);font-size:18px}

/* product cards */
.shop{display:grid;gap:var(--s4) var(--s3);grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:820px){.shop{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{min-width:0;display:flex;flex-direction:column;gap:6px}
.card .media{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:22px;background:var(--t,var(--paper));display:flex;align-items:center;justify-content:center}
.card .media>img{width:100%;height:100%;object-fit:cover}
.card .media>.pc{width:70%}
.card .media.mx{display:grid;grid-template-columns:1fr 1fr;gap:6%;padding:12%}
.card .media.mx>*{width:100%}
.card h3{font-size:16px}
.card .spec{font-size:13px;opacity:.8}
.card .food{font-size:12px;opacity:.75}
.card .price{font-family:var(--latin);font-size:19px;font-weight:500}
.card .buy{font-size:13px;text-decoration:none;background:var(--fg);color:var(--sbg);border-radius:99px;padding:4px 14px;align-self:flex-start}
.tagdiy{position:absolute;left:8px;top:8px;font-size:11px;background:var(--charcoal);color:var(--cotton);border-radius:99px;padding:2px 8px}
.note02{position:absolute;left:8px;bottom:8px;font-size:11px;background:var(--cotton);color:var(--charcoal);border-radius:99px;padding:2px 8px}

/* corporate + workshop */
.split{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ticks li{padding-left:24px;position:relative}.ticks li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:50%;border:2px dashed currentColor}
.steps{display:grid;gap:var(--s2);grid-template-columns:repeat(3,minmax(0,1fr));counter-reset:s}
.steps div{background:color-mix(in srgb,var(--fg) 10%,transparent);border-radius:16px;padding:var(--s2) var(--s3);font-size:14px;counter-increment:s}
.steps div::before{content:"0" counter(s);display:block;font-family:var(--latin);font-size:22px;font-weight:500}
.panel{background:var(--paper);color:var(--charcoal);border-radius:24px;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);box-shadow:0 10px 30px rgba(42,39,37,.15)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:#6E6A64}
.field input{font:inherit;font-size:16px;color:var(--charcoal);background:#fff;border:1px solid var(--line);border-radius:12px;padding:var(--s2) var(--s3);min-height:46px;width:100%}
.ncard{width:100%;max-width:360px;aspect-ratio:89/55;background:var(--paper);box-shadow:0 2px 10px rgba(42,39,37,.18);display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);position:relative;overflow:hidden;border-radius:6px}
.ncard .lg{width:46px}.ncard b{font-family:var(--th);font-weight:500;font-size:18px;display:block;overflow-wrap:anywhere}
.ncard small{font-size:12px;color:#6E6A64}.ncard .band{position:absolute;left:0;right:0;bottom:0;height:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;min-height:40px;cursor:pointer;font-family:var(--th);font-size:14px;color:var(--charcoal)}
.opts button[aria-pressed="true"]{border-color:var(--charcoal);background:var(--charcoal);color:var(--cotton)}
.stepper{display:flex;align-items:center;gap:var(--s2)}
.stepper button{width:44px;height:44px;border:2px solid var(--charcoal);border-radius:50%;background:transparent;font-size:20px;cursor:pointer;color:var(--charcoal)}
.stepper output{font-family:var(--latin);font-size:22px;min-width:3ch;text-align:center}
.mocknote{font-size:12px;opacity:.85;border-left:3px solid currentColor;padding-left:var(--s2)}
.panel .btn.solid{--fg:var(--charcoal);--sbg:var(--cotton)}

/* footer */
.mfoot .in{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.mfoot .in{grid-template-columns:auto 1fr 1fr 1fr}}
.mfoot .col{display:flex;flex-direction:column;gap:4px;font-size:14px}
.mfoot .col b{font-family:var(--latin);font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:400}
.mfoot a{text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--charcoal);color:var(--cotton);
  font-family:var(--th);font-size:14px;padding:var(--s2) var(--s4);border-radius:99px;max-width:calc(100% - 32px)}

/* ---------- D1 สมุดภาพ ---------- */
.d1 .hero{min-height:min(94vh,780px);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding-block:var(--s6)}
.d1 .hero .t{position:relative;z-index:4;display:flex;flex-direction:column;gap:var(--s3);align-items:center;max-width:24ch}
.d1 .hero h1{font-size:clamp(44px,13vw,92px);line-height:1.05}
.d1 .chapter{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--s4);align-items:center;background:var(--paper);color:var(--charcoal);border-radius:26px;padding:var(--s4);box-shadow:0 8px 24px rgba(42,39,37,.12)}
.d1 .chapter .part{font-family:var(--latin);font-weight:300;font-size:clamp(30px,8vw,48px)}
.d1 .card .media{background:color-mix(in srgb,#fff 55%,transparent)}

/* ---------- D2 ไม่ซ้ำสักชิ้น ---------- */
.d2 .faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,2.4vw,22px);padding-block:var(--s4)}
@media (min-width:820px){.d2 .faces{grid-template-columns:repeat(10,minmax(0,1fr))}}
.d2 .faces button{border:0;background:none;padding:0;cursor:pointer}
.d2 .faces .pc{transition:transform .25s}
.d2 .faces button:hover .pc,.d2 .faces button.on .pc{transform:scale(1.14) rotate(-8deg)}
.d2 .hero-t{display:flex;flex-direction:column;gap:var(--s3);text-align:center;align-items:center}
.d2 .who{display:flex;gap:var(--s4);flex-wrap:wrap}
.d2 .who div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;width:70px;text-align:center}
.d2 .card{text-align:center;align-items:center}.d2 .card .buy{align-self:center}
.d2 .shop{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:820px){.d2 .shop{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ---------- D3 บทความ ---------- */
.d3 .hero{display:grid;grid-template-columns:minmax(0,1fr);min-height:640px;overflow:hidden}
.d3 .hero .in{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:var(--s3);min-height:560px}
.d3 .hero .left{display:flex;flex-direction:column;justify-content:space-between;gap:var(--s5);position:relative;z-index:3}
.d3 .hero .small{font-family:var(--latin);font-size:14px;line-height:1.4;max-width:22ch}
.d3 .hero .vert{writing-mode:vertical-rl;font-family:var(--latin);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:15px;justify-self:end;z-index:3}
.d3 .hero .big{font-family:var(--latin);font-weight:500;font-size:clamp(40px,12vw,88px);letter-spacing:.03em;line-height:.95;text-transform:uppercase}
.d3 .hero .acc{display:flex;gap:6px}.d3 .hero .acc i{width:30px;height:20px}
.d3 .hero .px{width:min(78vw,470px);right:-6%;top:12%;z-index:2}
.d3 .partno{display:flex;align-items:baseline;gap:var(--s2);font-family:var(--latin)}
.d3 .partno span{font-size:14px;font-weight:500}.d3 .partno b{font-size:clamp(64px,16vw,120px);font-weight:500;line-height:.85}
.d3 .ed{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr);align-items:center}
@media (min-width:820px){.d3 .ed{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.d3 .ed.rev>:first-child{order:2}}
.d3 .ed .ph{aspect-ratio:4/5;overflow:hidden;border-radius:4px}.d3 .ed .ph img{width:100%;height:100%;object-fit:cover}
.d3 .shop{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
@media (min-width:820px){.d3 .shop{grid-template-columns:repeat(2,minmax(0,1fr))}}
.d3 .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2) var(--s3);align-items:end}
.d3 .card .media{grid-row:span 6;aspect-ratio:3/4;border-radius:4px}
.d3 .card .no{font-family:var(--latin);font-size:46px;font-weight:500;line-height:1}

/* ---------- D4 ขอบหยัก ---------- */
.d4 .hero{text-align:center;padding-block:var(--s5) 150px;overflow:hidden}
.d4 .hero h1{font-size:clamp(46px,12vw,84px);line-height:1.04}
.d4 .doodle{position:absolute;z-index:1}
.d4 .seat{position:absolute;bottom:12px;width:31%;max-width:230px;z-index:3}
.d4 .ttl{text-align:center;align-items:center}
.d4 .card{background:var(--paper);color:var(--charcoal);padding:var(--s3);border-radius:30px;align-items:center;text-align:center;--fg:var(--charcoal);--sbg:var(--paper)}
.d4 .card .media{background:none;border-radius:0}
.d4 .card .media .shaped{width:92%;height:92%}
.d4 .card .pill{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.d4 .about{position:relative;max-width:560px;margin:0 auto;width:100%}
.d4 .about img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:40px}
.d4 .bub{position:absolute;background:var(--paper);color:var(--charcoal);border-radius:22px;padding:8px 14px;font-size:14px;max-width:62%;box-shadow:0 6px 16px rgba(42,39,37,.18)}

/* ---------- D5 แคตตาล็อก ---------- */
.d5 .mhead nav{background:var(--paper);border-radius:99px;padding:4px}
.d5 .mhead nav a{padding:4px 12px;border-radius:99px}.d5 .mhead nav a.on{background:var(--dad);color:var(--cotton)}
.d5 .hero{text-align:center}
.d5 .hero .in{align-items:center}
.d5 .hero h1{color:var(--dad);font-size:clamp(36px,9vw,66px)}
.d5 .search{width:min(100%,360px);border:2px solid var(--dad);background:var(--paper);border-radius:99px;padding:8px 16px;font-size:14px;color:#6E6A64;text-align:left}
.d5 .opts button[aria-pressed="true"]{background:var(--dad);border-color:var(--dad)}
.d5 .card .media .pc{width:64%}
.d5 .card .dot{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--dad);font-size:15px}
.d5 .card .row{justify-content:space-between}
.d5 .bigfoot .in{background:var(--dad);color:var(--cotton);border-radius:28px;padding:var(--s5) var(--s4);display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.d5 .bigfoot .in{grid-template-columns:1.3fr 1fr 1fr 1fr}}
.d5 .bigfoot .big{font-family:var(--th);font-size:44px;line-height:1}

/* ---------- D6 หน้าต่างแพตเทิร์น ---------- */

/* ---------- die shapes ---------- */
function pathD(code){ const s=SH[code]; return [s.outline,...s.holes].map(p=>"M"+p.map(q=>q[0]+" "+q[1]).join("L")+"Z").join(""); }
function clipD(code){ const s=SH[code]; return "M"+s.outline.map(p=>(p[0]/s.w).toFixed(4)+" "+(p[1]/s.h).toFixed(4)).join("L")+"Z"; }
function sil(code, fill, opts={}){
  const s=SH[code], sw=opts.stroke?`stroke="${opts.stroke}" stroke-width="${opts.sw||1}" vector-effect="non-scaling-stroke" stroke-linejoin="round"`:"";
  const slits = opts.slits===false?"":s.slits.map(l=>`<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${opts.slit||"rgba(0,0,0,.45)"}" stroke-width="${opts.sw||1}" vector-effect="non-scaling-stroke"/>`).join("");
  const f = opts.face ? (()=>{ const a=ANCHOR_MM[code]; return `<g transform="translate(${a[0]-a[2]/2} ${a[1]-a[2]/2}) scale(${a[2]/100})">${faceG(opts.face[0],opts.face[1])}</g>`; })() : "";
  return `<svg viewBox="0 0 ${s.w} ${s.h}" aria-hidden="true" class="${opts.cls||""}" style="overflow:visible"><path d="${pathD(code)}" fill="${fill}" fill-rule="evenodd" ${sw}/>${slits}${f}</svg>`;
}
const CODES = ["01","02","03","04","05","07"];

/* ---------- painted faces: drawn like acrylic paint on leather (wobbly edges via #paint) ---------- */
function faceG(style, ink, cheek="#D9765F", filt=true){
  if(style==="none") return "";
  const sw=(w=5)=>`fill="none" stroke="${ink}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`, st=sw();
  const ck=`<circle cx="22" cy="60" r="${style==="shy"?11:8}" fill="${cheek}" opacity=".6"/><circle cx="78" cy="60" r="${style==="shy"?11:8}" fill="${cheek}" opacity=".6"/>`;
  const dot=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${ink}"/>`;
  const nose=`<path d="M48 52 Q50 56 52 52" ${sw(4)}/>`;
  let g="";
  if(style==="smile") g=dot(33,42)+dot(67,42)+nose+`<path d="M37 64 Q50 77 63 64" ${st}/>`;
  if(style==="sleep") g=`<path d="M25 42 Q33 49 41 42" ${st}/><path d="M59 42 Q67 49 75 42" ${st}/>`+nose+`<path d="M42 66 Q50 72 58 66" ${st}/>`;
  if(style==="wow") g=`<circle cx="33" cy="41" r="8" ${sw(4)}/><circle cx="67" cy="41" r="8" ${sw(4)}/>`+dot(33,42,3)+dot(67,42,3)+`<ellipse cx="50" cy="68" rx="6" ry="8" ${sw(4)}/>`;
  if(style==="wink") g=dot(33,42)+`<path d="M60 44 L68 39 L76 44" ${st}/>`+nose+`<path d="M37 63 Q50 76 63 63" ${st}/>`;
  if(style==="tongue") g=dot(33,42)+dot(67,42)+`<path d="M36 63 Q50 74 64 63" ${st}/><path d="M46 69 Q50 80 55 69" fill="#D9765F" stroke="${ink}" stroke-width="3"/>`;
  if(style==="shy") g=dot(34,43,4)+dot(66,43,4)+`<path d="M45 64 Q50 67 55 64" ${sw(4)}/>`;
  return `<g ${filt?'filter="url(#paint)"':""}>${ck}${g}</g>`;
}
function faceSvg(style, ink, w){ return `<svg class="face" viewBox="0 0 100 100" style="${w}" aria-hidden="true">${faceG(style,ink)}</svg>`; }
// a cut-out photo with an optional painted face
function pc(cut, face, extra=""){
  const a=ANCHOR[cut]||[50,50,48];
  const f=face&&face[0]!=="none"?faceSvg(face[0],face[1],`left:${a[0]}%;top:${a[1]}%;width:${a[2]}%`):"";
  return `<span class="pc" ${extra}><img src="assets/cut/${cut}.webp" alt="" loading="lazy">${f}</span>`;
}

/* ---------- craft textures, built once from the die files ---------- */
(function textures(){
  const grain=`<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .55 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>`;
  const stamp=(codes,col)=>{ let g=""; codes.forEach((c,i)=>{ const s=SH[c], k=46/Math.max(s.w,s.h), x=(i%2)*75+14, y=Math.floor(i/2)*75+14;
    g+=`<g transform='translate(${x} ${y}) rotate(${i*17} 23 23) scale(${k.toFixed(3)})'><path d='${pathD(c)}' fill='none' stroke='${col}' stroke-width='${(2.2/k).toFixed(2)}' fill-rule='evenodd'/></g>`; });
    return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'>${g}</svg>`)}")`; };
  const css=`:root{--grain:url("data:image/svg+xml,${grain.replace(/#/g,"%23").replace(/"/g,"'").replace(/</g,"%3C").replace(/>/g,"%3E")}")}
.p-stamp{--stamp:${stamp(["05","07","03","04"],"rgba(42,39,37,.13)")}}
.bg-dad.p-stamp,.bg-mom.p-stamp,.bg-bene.p-stamp,.bg-charcoal.p-stamp,.bg-hide.p-stamp,.bg-teak.p-stamp{--stamp:${stamp(["07","05","04","03"],"rgba(244,240,232,.18)")}}`;
  const st=document.createElement("style"); st.textContent=css; document.head.appendChild(st);
})();

function media(p, mode, t){
  const bg=t?`style="--t:${t}"`:"";
  if(mode==="photo") return `<div class="media" ${bg}><img src="assets/img/${p.img}.jpg" alt="${esc(p.name)}" loading="lazy">${p.n==="02"?'<span class="note02">ภาพจากบล็อกตัด</span>':""}</div>`;
  if(p.kind==="set") return `<div class="media mx" ${bg}>${p.cuts.map((c,i)=>c==="02"?sil("02","#B07A4A",{slit:"rgba(0,0,0,.3)",face:["smile","#FBF7EE"]}):pc(c,[["sleep","#24201E"],0,["wow","#FBF7EE"],["smile","#24201E"]][i])).join("")}</div>`;
  if(mode==="shape"){
    const inner = p.cut?`<image href="assets/cut/${p.cut}.webp" x="-.06" y="-.06" width="1.12" height="1.12" preserveAspectRatio="xMidYMid slice"/>`:`<rect width="1" height="1" fill="#B07A4A"/>`;
    const a=ANCHOR_MM[p.n], s=SH[p.n];
    return `<div class="media"><svg class="shaped" viewBox="0 0 1 1" aria-label="${esc(p.name)}" style="overflow:visible"><defs><clipPath id="cp${p.id}" clipPathUnits="objectBoundingBox"><path d="${clipD(p.n)}"/></clipPath></defs>
      <g clip-path="url(#cp${p.id})"><rect width="1" height="1" fill="#C89A6A"/>${inner}</g>
      <g transform="translate(${(a[0]-a[2]/2)/s.w} ${(a[1]-a[2]/2)/s.h}) scale(${a[2]/s.w/100} ${a[2]/s.h/100})">${faceG(p.face[0],p.face[1])}</g></svg><span class="tagdiy">ตัวอย่างแต่ง</span></div>`;
  }
  const img = p.cut?pc(p.cut,p.face):`<span class="pc" style="width:62%">${sil("02","#B07A4A",{slit:"rgba(0,0,0,.3)",face:p.face})}</span><span class="note02">ยังไม่มีรูปจริง</span>`;
  return `<div class="media" ${bg}>${img}<span class="tagdiy">ตัวอย่างแต่ง</span>${mode==="tile"?`<span class="dot" aria-hidden="true">+</span>`:""}</div>`;
}
function card(p, mode, t){
  const food = p.food?`<span class="food">ไม่ใช่ภาชนะใส่อาหาร</span>`:"";

  if(mode==="editorial") return `<article class="card">${media(p,"photo",t)}<span class="no">${p.n==="MX"?"SET":p.n}</span><h3>${esc(p.name)}</h3><span class="spec">${p.size}</span>${food}<span class="price">${p.price}.-</span>${buy}</article>`;
  if(mode==="swatch") return `<article class="card">${media(p,"cut",t)}<div class="lab"><span class="code">${p.id}</span><h3>${esc(p.name)}</h3><span class="spec">${p.size}</span>${food}<div class="row" style="justify-content:space-between"><span class="price">${p.price}.-</span>${buy}</div></div></article>`;
  if(mode==="tile") return `<article class="card" data-kind="${p.kind}">${media(p,"tile",t)}<h3>${esc(p.name)}</h3><span class="spec">${p.size}</span>${food}<div class="row"><span class="price">${p.price}.-</span>${buy}</div></article>`;
  if(mode==="shape") return `<article class="card">${media(p,"shape")}<h3>${esc(p.name)}</h3>${food}<div class="pill"><span class="price">${p.price}.-</span>${buy}</div></article>`;
  return `<article class="card">${media(p,mode,t)}<h3>${esc(p.name)}</h3><span class="spec">${p.size} · หนังวัวแท้จากเศษหนัง</span>${food}<span class="price">${p.price} บาท</span>${buy}</article>`;
}

}
const RENDER = {d1,d2,d3,d4,d5,d6};

/* ---------- 3D simulator with painted faces ---------- */
const S = {code:"01", leather:2, face:"smile", ink:0, three:null};
const simEl = document.createElement("div"); simEl.className="sim"; simEl.id="simbox";
simEl.innerHTML = `<div class="sim-stage" id="stage"><canvas id="simc" aria-label="ชิ้นหนังจำลอง 3D"></canvas><div id="flat" hidden></div><span class="hint">ลากเพื่อหมุน</span></div>
<div class="sim-ui"><span class="lbl">แพตเทิร์น</span><div class="pchips">${CODES.map(c=>`<button type="button" data-code="${c}" aria-pressed="${c===S.code}" aria-label="แพตเทิร์น ${c} ${SH[c].name}">${sil(c,"#B07A4A",{slit:"rgba(0,0,0,.35)"})}<span>${c}</span></button>`).join("")}</div>
<span class="lbl">สีหนัง · <span id="lname"></span></span><div class="swatches">${LEATHER.map((l,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===S.leather}" aria-label="หนัง${l[0]}" style="background:${l[1]}"></button>`).join("")}</div>
<span class="lbl">วาดหน้า</span><div class="fchips">${FACES.map(f=>`<button type="button" data-face="${f[0]}" aria-pressed="${f[0]===S.face}" aria-label="${f[1]}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#B07A4A"/>${faceG(f[0],"#FBF7EE","#D9765F",false)}</svg><span>${f[1]}</span></button>`).join("")}</div>
<span class="lbl">สีที่ใช้วาด · <span id="iname"></span></span><div class="swatches ink">${INK.map((c,i)=>`<button type="button" data-ink="${i}" aria-pressed="${i===S.ink}" aria-label="สี${c[0]}" style="background:${c[1]}"></button>`).join("")}</div>
<p class="sim-info" id="info"></p>
<div class="row"><a class="btn solid" id="simbuy" href="${LINK.line}" target="_blank" rel="noopener" data-copy="">สั่งแบบนี้ทาง LINE</a></div>
<p class="cap">สีจริงแต่ละชิ้นต่างกันเล็กน้อย เพราะเป็นเศษหนังจริง · รูปทรงและรอยร่องจากไฟล์บล็อกตัดขนาดจริง · หนา 1.0–1.2 มม. ขอบไม่ทาสี · หน้าที่วาดเป็นไอเดียแต่งเอง</p></div>`;
function simText(){
  const s=SH[S.code], l=LEATHER[S.leather], cm=(Math.max(s.w,s.h)/10).toFixed(1), fn=FACES.find(f=>f[0]===S.face)[1];
  $("#lname",simEl).textContent=l[0]; $("#iname",simEl).textContent=INK[S.ink][0];
  $("#info",simEl).textContent=`${S.code} ${s.name} · หนัง${l[0]} · ${S.face==="none"?"ไม่วาดหน้า":"หน้า"+fn+" สี"+INK[S.ink][0]} · ${cm} ซม.`;
  $("#simbuy",simEl).dataset.copy=`สนใจแพตเทิร์น ${S.code} ${s.name} หนังสี${l[0]}${S.face==="none"?"":" วาดหน้า"+fn+" สี"+INK[S.ink][0]}`;
  document.querySelectorAll("[data-pick]").forEach(e=>e.textContent=`แบบที่เลือกไว้: ${S.code} ${s.name} · หนัง${l[0]}${S.face==="none"?"":" · หน้า"+fn}`);
}
function noiseTex(){
  const c=document.createElement("canvas"); c.width=c.height=256; const g=c.getContext("2d"), d=g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){ const v=128+(Math.random()-.5)*90; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
  g.putImageData(d,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1/45,1/45); return t;
}
function mottleTex(){
  const c=document.createElement("canvas"); c.width=c.height=512; const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,512,512);
  for(let k=0;k<260;k++){ const x=Math.random()*512,y=Math.random()*512,r=10+Math.random()*60, v=200+Math.random()*55|0;
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${v},${v},${v},.35)`); gr.addColorStop(1,"rgba(255,255,255,0)"); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); }
  const d=g.getImageData(0,0,512,512); for(let i=0;i<d.data.length;i+=4){ const n=(Math.random()-.5)*26; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n; } g.putImageData(d,0,0);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1/70,1/70); return t;
}
// the face is painted on a thin transparent decal that sits on the grain side
function faceDecal(){
  const T=S.three; if(!T||!T.mesh) return;
  if(T.decal){ T.mesh.remove(T.decal); T.decal.geometry.dispose(); T.decal.material.map&&T.decal.material.map.dispose(); T.decal.material.dispose(); T.decal=null; }
  if(S.face==="none") return;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512"><defs><filter id="paint"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs>${faceG(S.face,INK[S.ink][1])}</svg>`;
  const img=new Image(), want=S.face+S.ink+S.code;
  img.onload=()=>{ if(S.face+S.ink+S.code!==want||!S.three.mesh) return;
    const c=document.createElement("canvas"); c.width=c.height=512; c.getContext("2d").drawImage(img,0,0,512,512);
    const tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding;
    const s=SH[S.code], a=ANCHOR_MM[S.code];
    const m=new THREE.Mesh(new THREE.PlaneGeometry(a[2],a[2]),new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:.55,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
    m.position.set(a[0]-s.w/2, s.h/2-a[1], .82); if(T.decal) T.mesh.remove(T.decal); T.decal=m; T.mesh.add(m); };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
function buildMesh(){
  const T=S.three, s=SH[S.code], cx=s.w/2, cy=s.h/2;
  if(T.mesh){ T.group.remove(T.mesh); T.mesh.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); T.decal=null; }
  const shp=new THREE.Shape(s.outline.map(p=>new THREE.Vector2(p[0]-cx, cy-p[1])));
  s.holes.forEach(h=>shp.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0]-cx, cy-p[1])))));
  const depth=1.2, g=new THREE.ExtrudeGeometry(shp,{depth,bevelEnabled:true,bevelThickness:.18,bevelSize:.18,bevelSegments:2,curveSegments:6});
  g.translate(0,0,-depth/2);
  const m=new THREE.Mesh(g,[T.top,T.edge]);
  const slitMat=new THREE.MeshBasicMaterial({color:0x1a1513});
  s.slits.forEach(l=>{ const x1=l[0]-cx,y1=cy-l[1],x2=l[2]-cx,y2=cy-l[3], len=Math.hypot(x2-x1,y2-y1);
    const b=new THREE.Mesh(new THREE.BoxGeometry(len,.55,depth+.5),slitMat); b.position.set((x1+x2)/2,(y1+y2)/2,0); b.rotation.z=Math.atan2(y2-y1,x2-x1); m.add(b); });
  T.mesh=m; T.group.add(m); setColor(); faceDecal();
}
function setColor(){ const T=S.three; if(!T) return; const c=new THREE.Color(LEATHER[S.leather][1]).convertSRGBToLinear();
  T.top.color.copy(c); T.edge.color.copy(c.clone().lerp(new THREE.Color("#D8C2A2").convertSRGBToLinear(),.4)); }
function flat(){ const f=$("#flat",simEl); f.hidden=false; f.innerHTML=sil(S.code,LEATHER[S.leather][1],{slit:"rgba(0,0,0,.5)",face:S.face==="none"?null:[S.face,INK[S.ink][1]]}); $("#simc",simEl).hidden=true; }
function initThree(){
  if(S.three!==null) return;
  if(!window.THREE){ S.three=false; flat(); return; }
  const cv=$("#simc",simEl); let r;
  try{ r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); }catch(_){ S.three=false; flat(); return; }
  r.setPixelRatio(Math.min(2,devicePixelRatio)); r.outputEncoding=THREE.sRGBEncoding;
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1,1,2000); cam.position.set(0,-120,190); cam.lookAt(0,0,0);
  scene.add(new THREE.HemisphereLight(0xfff3e2,0x5a4c40,.6));
  const dl=new THREE.DirectionalLight(0xffffff,.75); dl.position.set(-90,-40,150); scene.add(dl);
  const rim=new THREE.DirectionalLight(0xffe2c4,.45); rim.position.set(120,140,40); scene.add(rim);
  const top=new THREE.MeshStandardMaterial({roughness:.72,metalness:0,map:mottleTex(),bumpMap:noiseTex(),bumpScale:.55});
  const edge=new THREE.MeshStandardMaterial({roughness:.95,metalness:0});
  const group=new THREE.Group(); scene.add(group);
  S.three={r,scene,cam,group,top,edge,mesh:null,decal:null,rx:-.5,ry:.25,drag:null,visible:false};
  buildMesh();
  const stage=$("#stage",simEl);
  const size=()=>{ const w=stage.clientWidth||300; r.setSize(w,w,false); };
  size(); new ResizeObserver(size).observe(stage);
  stage.addEventListener("pointerdown",e=>{ S.three.drag={x:e.clientX,y:e.clientY,rx:S.three.rx,ry:S.three.ry}; stage.setPointerCapture(e.pointerId); stage.style.cursor="grabbing"; });
  stage.addEventListener("pointermove",e=>{ const d=S.three.drag; if(!d) return; S.three.ry=d.ry+(e.clientX-d.x)*.01; S.three.rx=Math.max(-1.4,Math.min(1.2,d.rx+(e.clientY-d.y)*.01)); });
  const up=()=>{ S.three.drag=null; stage.style.cursor=""; }; stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
  new IntersectionObserver(es=>{ S.three.visible=es[0].isIntersecting; }).observe(stage);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // turntable sway rather than a full spin, so the painted face keeps facing the viewer most of the time
  let t0=performance.now();
  (function loop(now){ requestAnimationFrame(loop); const T=S.three; if(!T.visible) return;
    const sway=(!T.drag&&!still)?Math.sin((now-t0)/1600)*.55:0;
    T.group.rotation.set(T.rx,0,0); T.mesh.rotation.set(0,0,T.ry+sway); T.r.render(T.scene,T.cam); })(t0);
}
simEl.addEventListener("click",e=>{
  const upd=fn=>{ fn(); simText(); };
  const p=e.target.closest("[data-code]"); if(p) return upd(()=>{ S.code=p.dataset.code; simEl.querySelectorAll("[data-code]").forEach(b=>b.setAttribute("aria-pressed",String(b===p))); S.three?buildMesh():S.three===false&&flat(); });
  const w=e.target.closest("[data-i]"); if(w) return upd(()=>{ S.leather=+w.dataset.i; simEl.querySelectorAll("[data-i]").forEach(b=>b.setAttribute("aria-pressed",String(b===w))); S.three?setColor():S.three===false&&flat(); });
  const f=e.target.closest("[data-face]"); if(f) return upd(()=>{ S.face=f.dataset.face; simEl.querySelectorAll("[data-face]").forEach(b=>b.setAttribute("aria-pressed",String(b===f))); S.three?faceDecal():S.three===false&&flat(); });
  const k=e.target.closest("[data-ink]"); if(k) return upd(()=>{ S.ink=+k.dataset.ink; simEl.querySelectorAll("[data-ink]").forEach(b=>b.setAttribute("aria-pressed",String(b===k))); S.three?faceDecal():S.three===false&&flat(); });
});

/* ---------- page wiring ---------- */
function parallax(){
  const vh=innerHeight;
  document.querySelectorAll("#view [data-depth]").forEach(el=>{ const host=el.parentElement, r=host.getBoundingClientRect(); if(r.bottom<-200||r.top>vh+200) return;
    const off=(r.top+r.height/2-vh/2)*-(+el.dataset.depth); el.style.transform=`translate3d(0,${off.toFixed(1)}px,0) rotate(${el.dataset.rot||0}deg)`; });
}
let ticking=false; addEventListener("scroll",()=>{ if(!ticking){ ticking=true; requestAnimationFrame(()=>{ parallax(); ticking=false; }); } },{passive:true});
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function sumv(){
  return `<section class="sec gut bg-cotton p-ging"><div class="in"><span class="eyebrow">สรุป · รอบ 2 · 22 ต.ค. 2569</span><h1>เว็บ OCT. 26 หกแบบ ฉบับสีสัน</h1>
<p class="lead">ทำใหม่ทั้ง 6 แบบตามที่ขอ: สีสันมากขึ้น พื้นหลังเปลี่ยนสีทุกบท ใช้ลายแบบงานคราฟต์ และวาดหน้าบนชิ้นหนัง</p>
<ul class="ticks"><li>พื้นหลังใช้ห้าสีของบ้าน ทั้งสีเต็มและสีอ่อน แต่ละบทไม่ซ้ำกัน</li><li>ลายคราฟต์: ตะเข็บเย็บมือ จุดตอกรู ลายผ้าตาราง ลายทาง ตราประทับรูปบล็อกตัด และเนื้อกระดาษ</li><li>หน้าที่วาด 6 แบบ (ยิ้ม หลับตา ว้าว ขยิบตา แลบลิ้น เขิน) วาดด้วยเส้นสั่นนิด ๆ เหมือนพู่กัน บนชิ้น 01, 03, 04, 05, 07 และ 02</li><li>ตัวจำลอง 3D เลือกวาดหน้าและสีที่ใช้วาดได้ 7 สี หน้าติดบนผิวหนังและหมุนไปด้วย</li></ul>
<h2>ต้องตัดสินใจ</h2><ul class="ticks"><li>เอกสารสถานะเขียนว่า “ห้ามใช้หน้าหมีในงานใหม่” แต่รอบนี้วาดหน้าบน 01 ตามที่ขอ ใช้ต่อหรือให้หน้าอยู่เฉพาะ 03, 04, 05, 07</li><li>Brand Book v2 ให้ห้าสีเป็นจุดเล็กซ่อนข้างใน รอบนี้ใช้เต็มพื้นหลัง ถ้าชอบ ควรแก้เล่ม</li><li>หน้าที่วาดเป็นตัวอย่างการแต่งเอง (บูธ เวิร์กช็อป) ของพร้อมส่งยังเป็นชิ้นเรียบ จะขายแบบวาดหน้าแล้วด้วยไหม</li></ul>
<h2>ไฟล์</h2><p class="cap">web-directions-20261022/template-v2.html → index-v2.html ในกิ่ง claude/funny-tesla-4dkwm7 · รอบ 1 ยังดูได้ที่ลิงก์เดิม</p></div></section>`;
}
function show(id, keepScroll){
  if(id==="sum"){ $("#view").className=""; $("#view").innerHTML=sumv(); document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.id==="sum"?"page":"false")); $("#what").textContent="สรุปรอบ 2 และเรื่องที่ต้องตัดสินใจ"; if(!keepScroll) scrollTo(0,0); return; }
  const d=DIRS.find(x=>x.id===id)||DIRS[0];
  $("#view").className=d.id; $("#view").innerHTML=RENDER[d.id]();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.id===d.id?"page":"false"));
  $("#what").textContent=`แบบ ${d.id.slice(1)} ${d.name} (ref ${d.ref}) · ${d.what}`;
  // earlier bands sit above later ones, so a scalloped edge can hang over the next colour
  const bands=[...document.querySelectorAll("#view .sec")]; bands.forEach((b,i)=>b.style.zIndex=bands.length-i);
  $(".sim-slot").appendChild(simEl); simText();
  if(!keepScroll) scrollTo(0,0);
  if(!still) parallax(); else document.querySelectorAll("#view [data-depth]").forEach(el=>el.style.transform=`rotate(${el.dataset.rot||0}deg)`);
  new IntersectionObserver((es,o)=>{ if(es[0].isIntersecting){ initThree(); o.disconnect(); } },{rootMargin:"300px"}).observe(simEl);
}
$("#tabs").innerHTML=DIRS.map(d=>`<a href="#${d.id}" data-id="${d.id}" role="tab">${d.id.slice(1)} · ${d.name}</a>`).join("")+`<a href="#sum" data-id="sum" role="tab">สรุป</a>`;
document.addEventListener("click",e=>{
  const t=e.target.closest("#tabs a"); if(t){ e.preventDefault(); history.replaceState(null,"","#"+t.dataset.id); show(t.dataset.id); return; }
  const a=e.target.closest('#view a[href^="#"]'); if(a){ e.preventDefault(); const el=document.getElementById(a.getAttribute("href").slice(1)); if(el) el.scrollIntoView({behavior:still?"auto":"smooth"}); return; }
  const c=e.target.closest("[data-copy]"); if(c&&c.dataset.copy){ try{ navigator.clipboard.writeText(c.dataset.copy).then(()=>toast("คัดลอกข้อความแล้ว วางในแชท LINE ได้เลย"),()=>{}); }catch(_){} }
  const f=e.target.closest(".faces button"); if(f){ document.querySelectorAll(".faces button.on").forEach(b=>b.classList.remove("on")); f.classList.add("on"); const l=$("#faceLab"); if(l) l.textContent=f.dataset.lab+" · ชิ้นนี้มีชิ้นเดียว"; }
  const o=e.target.closest("[data-one] button"); if(o){ o.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===o))); }
  const st=e.target.closest("[data-st]"); if(st){ const out=st.parentElement.querySelector("output"); out.textContent=Math.max(2,Math.min(60,+out.textContent+ +st.dataset.st)); }
  const fl=e.target.closest("[data-filter] button"); if(fl){ fl.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===fl)));
    document.querySelectorAll("#view .card[data-kind]").forEach(cd=>cd.hidden=fl.dataset.k!=="all"&&cd.dataset.kind!==fl.dataset.k); }
});
document.addEventListener("input",e=>{ if(e.target.id==="org") document.querySelectorAll("[data-org]").forEach(b=>b.textContent=e.target.value.trim()||"บริษัทของคุณ"); });
document.addEventListener("submit",e=>{ if(e.target.matches("[data-book]")){ e.preventDefault(); toast("mock: เว็บจริงจะส่งคำขอนี้ต่อไป LINE ของร้าน"); } });
show((location.hash.match(/^#(d[1-6]|sum)$/)||[])[1]||"d1", true);
