  --serp-bg:#FFFFFF;--serp-title:#1A0DAB;--serp-text:#4D5156;

  --r:14px;
}

  --accent:#D46A4E;--accent-ink:#1D1B1A;--ok:#94B567;--warn:#E9B44A;--warn-bg:#3D3220;--hide:#C3B2E2;--hide-bg:#352F42;--info:#8EA7D6;--bad:#E07E62;--bad-bg:#3F2620;
  --serp-bg:#202124;--serp-title:#8AB4F8;--serp-text:#BDC1C6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1B1A;--surface:#272423;--sunk:#322E2C;--ink:#F1ECE3;--muted:#ABA298;--line:#3E3936;

<script>
const DATA = /*DATA*/null;
const LIVE = DATA.products, SHOP = DATA.shop, ALT = DATA.alt, CFG = DATA.cfg, BANNED = DATA.banned;
const STATUS = {on:["ขายอยู่","แสดงทุกที่ สั่งได้"],out:["ของหมด","หน้ายังอยู่ ปุ่มสั่งเปลี่ยนเป็นถามรอบหน้า"],off:["ซ่อน","ไม่ขึ้นหน้าแรก ลิงก์เดิมพาไปหน้าแรก"]};
const FIELDS = {status:"สถานะ",name:"ชื่อบนเว็บ",price:"ราคา",size:"ขนาด",lead:"ข้อความหน้าสินค้า",uses:"ใช้ทำอะไรได้",photos:"รูป",seo:"ชื่อสำหรับค้นหา"};
const SHOPF = {shopee:"ลิงก์ร้าน Shopee",fair:"ชื่องาน",place:"สถานที่",dates:"วันที่",hours:"เวลา",until:"ประกาศบูธถึงวันที่"};
const REQ = {waiting:["รอ Claude","off"],working:["Claude กำลังทำ","out"],review:["รอกด Merge","out"],live:["ขึ้นเว็บแล้ว","on"],failed:["ไม่ผ่าน","bad"]};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

// drafts mirror the db: drafts/<SKU> and drafts/shop hold only the fields the owner changed; adds/<id> are new-product requests
let D = {p:{}, shop:{}}, ADDS = [], REQS = [];
let db = null, assets = null, me = "", canWrite = false, ready = false;
let cur = LIVE[0].id, sent = null, busy = false;
const timers = {}, inflight = {};

const live = id => LIVE.find(p => p.id === id);
const val = (id, f) => (D.p[id] && f in D.p[id]) ? D.p[id][f] : live(id)[f];
const shopVal = f => f in D.shop ? D.shop[f] : SHOP[f];
const diffs = id => Object.keys(D.p[id] || {}).filter(f => f in FIELDS && !same(D.p[id][f], live(id)[f]));
const shopDiffs = () => Object.keys(D.shop).filter(f => f in SHOPF && !same(D.shop[f], SHOP[f]));
// a photo is a catalog name (thumbs/<name>.jpg) or "asset:<id>" uploaded from this page
const thumb = ph => ph.startsWith("asset:") ? "/_blob/" + ph.slice(6) : `thumbs/${ph}.jpg`;

function setVal(id, f, v, typing){ if (!canWrite) return; D.p[id] = D.p[id] || {}; if (same(v, live(id)[f])) delete D.p[id][f]; else D.p[id][f] = v; queue(id); refresh(typing); }
function setShop(f, v, typing){ if (!canWrite) return; if (same(v, SHOP[f])) delete D.shop[f]; else D.shop[f] = v; queue("shop"); refresh(typing); }
// one write per draft doc, after typing pauses
function queue(doc){ clearTimeout(timers[doc]); timers[doc] = setTimeout(() => flush(doc), 600); }
async function flush(doc){
  clearTimeout(timers[doc]); delete timers[doc];
  if (!db) return;
  const body = doc === "shop" ? D.shop : (D.p[doc] || {});
  inflight[doc] = true;
  try {
    if (Object.keys(body).length) await db.doc("drafts/" + doc).set(Object.assign({}, body, {at: Date.now(), by: me}));
    else await db.doc("drafts/" + doc).delete();
  } catch (e) { failWrite(e); }
  delete inflight[doc];
}

function failWrite(e){

function bannedIn(text){
  const t = String(text).toLowerCase().replaceAll("ไม่ใช่ภาชนะใส่อาหาร", "");
  return BANNED.filter(b => t.includes(b[0].toLowerCase()));
}
// problems that stop a send (the build checks the same rules again)
function problems(id){
  const out = [], name = val(id,"name"), price = val(id,"price"), lead = val(id,"lead"), seo = val(id,"seo");
  if (!name.trim() || name.length > 40) out.push(["name","ชื่อต้องมี 1–40 ตัวอักษร"]);
  if (!Number.isInteger(price) || price < 1 || price > 9999) out.push(["price","ราคาเป็นบาทเต็ม 1–9,999"]);
  if (lead.length > 160) out.push(["lead",`ยาวเกิน 160 ตัวอักษร (ตอนนี้ ${lead.length})`]);
  if (!seo.trim()) out.push(["seo","ใส่ชื่อสำหรับค้นหา"]);
  if (!val(id,"photos").length) out.push(["photos","ต้องมีรูปอย่างน้อย 1 รูป"]);
  for (const f of ["name","lead","seo","size"]) for (const b of bannedIn(val(id,f))) out.push([f,`ใช้คำว่า "${b[0]}" ไม่ได้ (${b[1]})`]);
  val(id,"uses").forEach(u => bannedIn(u).forEach(b => out.push(["uses",`ใช้คำว่า "${b[0]}" ไม่ได้ (${b[1]})`])));
  return out;
}
function shopProblems(){
  const out = [], s = shopVal("shopee");
  if (s && !/^https:\/\/(shopee\.co\.th|s\.shopee\.co\.th)\//.test(s)) out.push(["shopee","ลิงก์ต้องขึ้นต้นด้วย https://shopee.co.th/"]);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(shopVal("until"))) out.push(["until","เลือกวันที่"]);
  for (const f of ["fair","place","dates","hours"]) for (const b of bannedIn(shopVal(f))) out.push([f,`ใช้คำว่า "${b[0]}" ไม่ได้ (${b[1]})`]);
  return out;
}
function allProblems(){
  const out = LIVE.flatMap(p => problems(p.id).map(x => [p.name, x[1]])).concat(shopProblems().map(x => ["ร้านและบูธ", x[1]]));
  if (LIVE.every(p => val(p.id,"status") === "off")) out.push(["สินค้า","ต้องมีสินค้าแสดงบนเว็บอย่างน้อย 1 ชิ้น"]);
  return out;
}

function changeTexts(){
  const out = [];

  for (const f of shopDiffs()) out.push(`${SHOPF[f]}: ${SHOP[f]||"ว่าง"} → ${D.shop[f]||"ว่าง"}`);
  for (const a of ADDS) out.push(`สินค้าใหม่: ${a.name} ${a.price} บาท แพตเทิร์น ${a.code}`);
  return out;
}
function snapshot(){

}

}

  <p>ทุกช่องบันทึกเป็นร่างทันที เปิดจากมือถือหรือคอมก็เห็นเหมือนกัน แก้ได้เฉพาะเจ้าของร้านและคนที่ได้สิทธิ์ Editor</p>
  <p>กดส่งคือคุณตกลงขึ้นเว็บแล้ว Claude แก้ข้อมูลสินค้า ตรวจคำต้องห้าม สร้างเว็บใหม่ เปิด PR ไว้เป็นบันทึก รอ Cloudflare ลองสร้างผ่าน แล้วขึ้นเว็บให้เอง ไม่ผ่านจะหยุดไว้ เว็บจริงไม่เปลี่ยน</p>
  <p>สินค้าใหม่ยังรอคุณกด Merge เพราะ Claude เขียนข้อความหน้าสินค้าให้ · อยากย้อน แก้กลับในหน้านี้แล้วส่งใหม่ หรือกด Revert ใน GitHub</p>
  <p>หลังเว็บเปลี่ยน ร่างที่ขึ้นแล้วหายเอง</p></div>`;

async function send(){
  if (busy || !canWrite) return;
  busy = true; renderSend();
  await flushAll();
  const changes = changeTexts();
  if (!changes.length || allProblems().length){ busy = false; renderSend(); return; }
  const ref = db.collection("requests").doc();
  try { await ref.set({at: Date.now(), by: me, status: "waiting", changes, drafts: snapshot(), note: ($("#note") ? $("#note").value : "").trim().slice(0, 300)}); }
  catch (e) { busy = false; failWrite(e); renderSend(); return; }
  const msg = `จัดการสินค้า OCT.26 คำขอ ${ref.id}\nทำตาม website/manage/APPLY.md · หน้าจัดการสินค้า: ${CFG.url}`;
  sent = {id: ref.id, msg, started: false, why: ""};
  const mcp = await use("mcp");
  if (!mcp) sent.why = "หน้านี้สั่ง Claude เองไม่ได้ในมุมมองนี้";
  else {
    try {
      const r = await mcp.callTool("Claude Code Remote", "create_session", {environment_id: CFG.env, source_url: CFG.repo, source_revision: CFG.base,
        outcome_branch: CFG.work, title: "OCT.26 จัดการสินค้า · " + ref.id, prompt: msg});
      const sid = (JSON.stringify(r.payload ?? r).match(/session_[A-Za-z0-9]+/) || [])[0] || "";
      try { await ref.update({status: "working", session: sid, startedAt: Date.now()}); } catch (_) {}
      sent.started = true; toast("ส่งให้ Claude แล้ว");
    } catch (e) {
      sent.why = ({server_not_connected:"ยังไม่ได้เพิ่ม Claude Code Remote ใน claude.ai Settings → Connectors", needs_reauth:"ต้องเชื่อม Claude Code Remote ใหม่ใน claude.ai Settings → Connectors",
        approval_required:"ต้องกดอนุญาตให้หน้านี้สั่ง Claude Code ก่อน กดส่งอีกครั้งแล้วเลือกอนุญาต", not_in_manifest:"หน้านี้ยังไม่ได้รับอนุญาตให้สั่ง Claude Code",
        server_unavailable:"Claude Code ไม่ตอบตอนนี้ อาจเริ่มไปแล้ว ดูคำขอล่าสุดก่อนกดใหม่", upstream_error:"Claude Code ไม่ตอบตอนนี้ อาจเริ่มไปแล้ว ดูคำขอล่าสุดก่อนกดใหม่"})[e && e.code] || "สั่ง Claude Code ไม่สำเร็จ";
    }
  }
  busy = false; refresh();
}

/* ---------- new product request ---------- */
function newForm(){
  $("#shopgrid").classList.add("open");
  document.querySelectorAll(".row[aria-current]").forEach(r => r.setAttribute("aria-current","false"));
  $("#editor").innerHTML = `<button type="button" class="back" data-back="1">‹ สินค้าทั้งหมด</button><h2>ขอเพิ่มสินค้าใหม่</h2>
  <p class="cap">Claude ทำหน้าสินค้า ขนาดจริงจากบล็อกตัด และชื่อสำหรับค้นหาให้ ต้องเป็นสินค้าชิ้นเดียว (ยังไม่ขายสินค้าที่ต่อชิ้น)</p>
  <form class="group" id="nf"><div class="f"><label for="n-name">ชื่อสินค้า</label><input type="text" id="n-name" required maxlength="40" placeholder="เช่น 07 ที่รองแก้ว"></div>
  <div class="two"><div class="f"><label for="n-code">แพตเทิร์น</label><select id="n-code">${["01","02","03","04","05","07"].map(c => `<option>${c}</option>`).join("")}</select></div>
  <div class="f"><label for="n-price">ราคา</label><div class="money"><input type="number" id="n-price" inputmode="numeric" min="1" max="9999" step="1" required><span>บาท</span></div></div></div>
  <div class="f"><label for="n-sku">รหัสสินค้า <small>ถ้ามีในชีตหรือ Shopee</small></label><input type="text" id="n-sku" maxlength="20" placeholder="เช่น OC-07-30"></div>
  <div class="f"><label for="n-photo">รูปจริง <small>อย่างน้อย 1 รูป</small></label><input type="file" id="n-photo" accept="image/*" required></div>
  <p class="err" id="n-err" hidden></p><button class="btn solid" type="submit" id="n-go">เพิ่มในรายการที่จะส่ง</button></form>`;

/* ---------- wiring ---------- */
// while someone types, the field they are in is never redrawn (a redrawn input closes the phone keyboard):
// only the counters, warnings and previews around it are patched in
const typing = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.closest("#editor, #shopform")); };
function patch(W, html){
  const N = document.createElement("div"); N.innerHTML = html;
  W.querySelectorAll(".f[data-f]").forEach(w => { const n = N.querySelector(`.f[data-f="${w.dataset.f}"]`); if (!n) return;
    w.className = n.className; const a = w.querySelector(".fx"), b = n.querySelector(".fx"); if (a && b) a.innerHTML = b.innerHTML; });
  W.querySelectorAll("[data-count]").forEach(c => { const m = N.querySelector(`[data-count="${c.dataset.count}"]`); if (m){ c.textContent = m.textContent; c.className = m.className; } });
  for (const sel of [".serp", ".ehead h2"]){ const a = W.querySelector(sel), b = N.querySelector(sel); if (a && b) a.innerHTML = b.innerHTML; }
}
function refresh(light){
  renderList();
  if (light || typing()){ if (!$("#nf") && $("#editor").innerHTML) patch($("#editor"), editorHTML()); patch($("#shopform"), shopHTML()); }
  else { if (!$("#nf")) renderEditor(); renderShop(); }
  if (!(document.activeElement && document.activeElement.id === "note")) renderSend();
  const n = changeCount(); $("#nbadge").hidden = !n; $("#nbadge").textContent = n;
  $("#dock").hidden = !n || !$("#v-send").hidden || !!sent;
  $("#dockt").innerHTML = `<b>${n}</b> การเปลี่ยนแปลงยังไม่ขึ้นเว็บ`;
}
function tab(t){ document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab===t))); ["products","shop","send"].forEach(v => $("#v-"+v).hidden = v!==t); scrollTo({top:0}); refresh(); }
let tt; function toast(m){ const el = $("#toast"); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2400); }

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.tab) return tab(t.dataset.tab);
  if (t.dataset.open){ cur = t.dataset.open; $("#shopgrid").classList.add("open"); renderEditor(); renderList(); if (innerWidth < 900) scrollTo({top:0}); return; }
  if (t.dataset.back){ $("#shopgrid").classList.remove("open"); $("#editor").innerHTML = ""; refresh(); return; }
  if (t.dataset.new) return newForm();
  if (t.dataset.unadd){ try { await db.doc("adds/" + t.dataset.unadd).delete(); } catch (err) { failWrite(err); } return; }
  if (t.dataset.s) return setVal(cur, "status", t.dataset.s);
  if (t.dataset.reset) return setVal(cur, t.dataset.reset, live(cur)[t.dataset.reset]);
  if (t.dataset.sreset) return setShop(t.dataset.sreset, SHOP[t.dataset.sreset]);
  if (t.dataset.mv){ const a = [...val(cur,"photos")], i = +t.dataset.mv, j = i + (+t.dataset.d); [a[i],a[j]] = [a[j],a[i]]; return setVal(cur,"photos",a); }
  if (t.dataset.rm){ const a = [...val(cur,"photos")]; a.splice(+t.dataset.rm,1); return setVal(cur,"photos",a); }
  if (t.dataset.send) return send();
  if (t.dataset.again){ sent = null; refresh(); return; }
  if (t.dataset.clear){ $("#clearAsk").hidden = false; return; }
  if (t.dataset.clearno){ $("#clearAsk").hidden = true; return; }
  if (t.dataset.clearyes){
    D = {p:{}, shop:{}}; for (const k of Object.keys(timers)) clearTimeout(timers[k]);
    try { const s = await db.collection("drafts").get(); for (const d of s.docs) await db.doc("drafts/" + d.id).delete(); for (const a of ADDS) await db.doc("adds/" + a.id).delete(); toast("ล้างร่างแล้ว"); }
    catch (err) { failWrite(err); }
    refresh(); return;
  }
  if (t.dataset.copymsg){ const m = $("#msg"); const sel = () => { const r = document.createRange(); r.selectNodeContents(m); const w = getSelection(); w.removeAllRanges(); w.addRange(r); toast("เลือกข้อความแล้ว กดคัดลอก"); };
    try { navigator.clipboard.writeText(m.textContent).then(() => toast("คัดลอกแล้ว"), sel); } catch (_) { sel(); } }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.in){ const f = el.dataset.in; setVal(cur, f, f === "price" ? (el.value === "" ? 0 : Number(el.value)) : el.value, true); }
  else if (el.dataset.use){ const a = [...val(cur,"uses")]; a[+el.dataset.use] = el.value; setVal(cur,"uses",a, true); }
  else if (el.dataset.shop) setShop(el.dataset.shop, el.value, true);
});
async function upload(file){
  if (!assets) throw {message: "อัปโหลดรูปไม่ได้จากหน้านี้"};
  if (!file.type.startsWith("image/")) throw {message: "เลือกไฟล์รูปภาพ"};
  const r = await assets.upload(file);
  return r.id;
}
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "f-up" && el.files[0]){
    toast("กำลังอัปโหลดรูป…");
    try { const id = await upload(el.files[0]); setVal(cur, "photos", [...val(cur,"photos"), "asset:" + id]); toast("เพิ่มรูปแล้ว"); }
    catch (err) { toast(err && err.code === "too_large" ? "รูปใหญ่เกิน 20 MB" : (err && err.message) || "อัปโหลดไม่สำเร็จ"); }
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "nf") return; e.preventDefault();
  const name = $("#n-name").value.trim(), price = Number($("#n-price").value), code = $("#n-code").value, sku = $("#n-sku").value.trim(), file = $("#n-photo").files[0], err = $("#n-err");
  const show = m => { err.hidden = false; err.textContent = m; };
  const bad = bannedIn(name)[0];
  if (!name || !Number.isInteger(price) || price < 1 || price > 9999) return show("ใส่ชื่อและราคาเป็นบาทเต็ม 1–9,999");
  if (bad) return show(`ใช้คำว่า "${bad[0]}" ไม่ได้ (${bad[1]})`);
  if (sku && LIVE.some(p => p.id === sku)) return show(`รหัส ${sku} มีอยู่แล้ว`);
  if (!file) return show("เลือกรูปจริงอย่างน้อย 1 รูป");
  $("#n-go").disabled = true; $("#n-go").textContent = "กำลังอัปโหลด…";
  try {
    const photo = await upload(file);
    await db.collection("adds").add({name, price, code, sku, photo, at: Date.now(), by: me});
    $("#shopgrid").classList.remove("open"); $("#editor").innerHTML = ""; refresh(); toast("เพิ่มในรายการที่จะส่งแล้ว");
  } catch (x) { $("#n-go").disabled = false; $("#n-go").textContent = "เพิ่มในรายการที่จะส่ง"; show((x && x.message) || "บันทึกไม่ได้ ลองอีกครั้ง"); }
});

async function start(){
  refresh();
  db = await use("db");
  const user = await use("user");
  if (!db){ $("#conn").textContent = "ดูได้อย่างเดียว"; $("#ro").hidden = false; refresh(); return; }
  me = user ? await user.id().catch(() => "") : "";
  const w = user ? await Promise.resolve(user.can("data.write")).catch(() => null) : null;
  canWrite = w !== false; $("#ro").hidden = canWrite;
  if (canWrite) assets = await use("assets");
  $("#conn").textContent = canWrite ? "บันทึกอัตโนมัติ" : "ดูได้อย่างเดียว";
  const strip = o => { const b = Object.assign({}, o); delete b.at; delete b.by; return b; };
  db.collection("drafts").onSnapshot(s => {
    const seen = new Set(s.docs.map(d => d.id));
    for (const d of s.docs){ if (timers[d.id] || inflight[d.id]) continue; if (d.id === "shop") D.shop = strip(d.data()); else D.p[d.id] = strip(d.data()); }
    for (const k of Object.keys(D.p)) if (!seen.has(k) && !timers[k] && !inflight[k]) delete D.p[k];
    if (!seen.has("shop") && !timers.shop && !inflight.shop) D.shop = {};
    refresh();
  }, () => {});
  db.collection("adds").onSnapshot(s => { ADDS = s.docs.map(d => Object.assign({id: d.id}, d.data())).sort((a, b) => (a.at||0) - (b.at||0)); refresh(); }, () => {});
  db.collection("requests").orderBy("at","desc").limit(6).onSnapshot(s => { REQS = s.docs; refresh(); }, () => {});
  refresh();
}
start();
</script>
