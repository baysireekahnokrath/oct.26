<style>
/* A shop counter on the phone: product list, one product open at a time, a send step that turns drafts into a PR.
   Brand Book v2: cotton ground, charcoal ink, dad red for actions, the five family colours as the stripe and states. */
:root{
  --bg:#F4F0E8;--surface:#FBF9F4;--sunk:#ECE6DB;--ink:#2A2725;--muted:#6B645D;--line:#DDD5C8;
  --accent:#A9442B;--accent-ink:#FBF9F4;--ok:#5E7A3A;--warn:#B7801A;--warn-bg:#F6E7C2;--hide:#7E6AA6;--hide-bg:#E9E1F3;--info:#2E4A7D;--bad:#A9442B;--bad-bg:#F5DDD5;
  --dad:#A9442B;--mom:#5E7A3A;--eldest:#E9A825;--middle:#B9A3D6;--youngest:#2E4A7D;
  --serp-bg:#FFFFFF;--serp-title:#1A0DAB;--serp-text:#4D5156;
  --th:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;--body:"IBM Plex Sans Thai",system-ui,sans-serif;--latin:"Jost","IBM Plex Sans Thai",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1B1A;--surface:#272423;--sunk:#322E2C;--ink:#F1ECE3;--muted:#ABA298;--line:#3E3936;
  --accent:#D46A4E;--accent-ink:#1D1B1A;--ok:#94B567;--warn:#E9B44A;--warn-bg:#3D3220;--hide:#C3B2E2;--hide-bg:#352F42;--info:#8EA7D6;--bad:#E07E62;--bad-bg:#3F2620;
  --serp-bg:#202124;--serp-title:#8AB4F8;--serp-text:#BDC1C6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1B1A;--surface:#272423;--sunk:#322E2C;--ink:#F1ECE3;--muted:#ABA298;--line:#3E3936;
  --accent:#D46A4E;--accent-ink:#1D1B1A;--ok:#94B567;--warn:#E9B44A;--warn-bg:#3D3220;--hide:#C3B2E2;--hide-bg:#352F42;--info:#8EA7D6;--bad:#E07E62;--bad-bg:#3F2620;
  --serp-bg:#202124;--serp-title:#8AB4F8;--serp-text:#BDC1C6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--th);font-weight:500;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.latin,.code,.num{font-family:var(--latin);font-variant-numeric:tabular-nums}
.cap{font-size:13px;color:var(--muted)}

/* header: wordmark, mock flag, family stripe */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:1080px;margin:0 auto}
.mark{font-family:var(--latin);font-weight:500;font-size:15px;line-height:1.05;letter-spacing:.04em}
.mark i{font-style:normal;color:var(--mom)}
.bar h1{font-size:18px;flex:1;min-width:0}
.flag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--warn-bg);color:var(--ink);white-space:nowrap}
.stripe{display:grid;grid-template-columns:repeat(5,1fr);height:4px}
.stripe span:nth-child(1){background:var(--dad)}.stripe span:nth-child(2){background:var(--mom)}.stripe span:nth-child(3){background:var(--eldest)}.stripe span:nth-child(4){background:var(--middle)}.stripe span:nth-child(5){background:var(--youngest)}

@media (min-width:900px){.shop{grid-template-columns:340px minmax(0,1fr);align-items:start}.shop .list{position:sticky;top:132px}}

.row:hover{border-color:var(--muted)}
.row[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.row img{width:56px;height:56px;border-radius:10px;object-fit:cover;display:block}
.row .t{min-width:0}
.row .t b{display:block;font-family:var(--th);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pill.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}

.editor{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:22px;min-width:0}
.back{display:none;border:0;background:none;padding:0;color:var(--accent);cursor:pointer;align-self:flex-start}
@media (max-width:899px){.shop.open .list{display:none}.back{display:inline}.shop:not(.open) .editor{display:none}}
.ehead{display:flex;gap:14px;align-items:center}
.ehead img{width:72px;height:72px;border-radius:12px;object-fit:cover}

.group{display:flex;flex-direction:column;gap:14px}
.group>h3{font-size:13px;font-family:var(--body);font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lab{font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.f label small,.f .lab small{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=url],input[type=date],textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{resize:vertical;min-height:84px;line-height:1.55}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
.f.changed input,.f.changed textarea{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.was{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.was s{overflow-wrap:anywhere}
.was button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline}
.err{font-size:13px;color:var(--bad);background:var(--bad-bg);padding:6px 10px;border-radius:8px}
.tip{font-size:13px;color:var(--warn);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{position:relative}.money input{padding-right:46px;font-family:var(--latin);font-size:18px}.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.seg button small{font-size:12px;color:var(--muted);line-height:1.35}
.seg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.seg button[data-s="on"][aria-pressed="true"] b{color:var(--ok)}.seg button[data-s="out"][aria-pressed="true"] b{color:var(--warn)}.seg button[data-s="off"][aria-pressed="true"] b{color:var(--hide)}
@media (max-width:420px){.seg{grid-template-columns:1fr}.seg button{flex-direction:row;align-items:baseline;gap:8px}}

.lock{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.lock svg{flex:none}

.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:96px;display:flex;flex-direction:column;gap:4px}
.ph .im{position:relative}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.ph .cover{position:absolute;left:6px;top:6px;font-size:11px;background:var(--ink);color:var(--surface);padding:0 6px;border-radius:6px}
.ph .new{position:absolute;right:6px;top:6px;font-size:11px;background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:6px}
.ph .ctl{display:flex;justify-content:space-between}
.ph .ctl button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:30px;height:28px;cursor:pointer;line-height:1}
.ph .ctl button:disabled{opacity:.35;cursor:default}
.addph{width:96px;height:96px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;padding:6px}
.addph:hover{border-color:var(--muted);color:var(--ink)}
.addph input{position:absolute;width:1px;height:1px;opacity:0}

.serp{background:var(--serp-bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;font-family:Arial,var(--body)}
.serp .u{font-size:12px;color:var(--serp-text)}
.serp .h{font-size:18px;line-height:1.35;color:var(--serp-title);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.serp .d{font-size:14px;line-height:1.5;color:var(--serp-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.long i{background:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--th);font-weight:500}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}

/* send dock: fixed to the bottom on phones */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock .in p{flex:1;min-width:0;font-size:14px}
.dock[hidden]{display:none}

/* shop settings + send */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;max-width:720px}
.stack{display:flex;flex-direction:column;gap:16px}
.chg{display:flex;flex-direction:column;gap:8px}
.chg h3{font-size:16px;display:flex;gap:8px;align-items:center}
.chg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.chg li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.chg li .k{color:var(--muted)}
.chg li .v{min-width:0;overflow-wrap:anywhere}
.chg li .v s{color:var(--muted)}
.chg li .v b{font-weight:500}
@media (max-width:480px){.chg li{grid-template-columns:1fr}}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--latin);font-size:13px;background:var(--sunk);color:var(--muted)}
.steps li.done .n{background:var(--ok);color:var(--surface)}
.steps li.now .n{background:var(--accent);color:var(--accent-ink)}
.steps b{font-family:var(--th);font-weight:500;display:block}
.how{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:99px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.row,.btn,.seg button{transition:border-color .15s,background .15s}}
</style>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*DATA*/null;
const LIVE = DATA.products, SHOP = DATA.shop, ALT = DATA.alt;
const KEY = "oct26-manage-mock";
// words the status doc rules out (no-sew joins untested, chemically tanned leather, no food contact, 07 replaces 06)
const BANNED = [["ไม่ต้องเย็บ","ข้อต่อยังไม่ผ่านการทดสอบ"],["ต่อเองได้","ข้อต่อยังไม่ผ่านการทดสอบ"],["ต่อชิ้นเอง","ข้อต่อยังไม่ผ่านการทดสอบ"],["ฟอกฝาด","หนังฟอกด้วยสารเคมี"],["ใส่อาหาร","ห้ามโดนอาหาร"],["ใช้กับอาหาร","ห้ามโดนอาหาร"],["สัมผัสอาหาร","ห้ามโดนอาหาร"],["food safe","ห้ามโดนอาหาร"],["food grade","ห้ามโดนอาหาร"],["ฟู้ดเกรด","ห้ามโดนอาหาร"],["ของเล่น","ไม่ทำของเด็กเล็ก"],["แพตเทิร์น 06","ใช้ 07 แทน 06"]];
const STATUS = {on:["ขายอยู่","แสดงทุกที่ สั่งได้"],out:["ของหมด","หน้ายังอยู่ ปุ่มสั่งเปลี่ยนเป็นถามรอบหน้า"],off:["ซ่อน","ไม่ขึ้นหน้าแรก ลิงก์เดิมพาไปหน้าแรก"]};
const FIELDS = {status:"สถานะ",name:"ชื่อบนเว็บ",price:"ราคา",size:"ขนาด",lead:"ข้อความหน้าสินค้า",uses:"ใช้ทำอะไรได้",photos:"รูป",seo:"ชื่อสำหรับค้นหา"};
const SHOPF = {shopee:"ลิงก์ร้าน Shopee",fair:"ชื่องาน",place:"สถานที่",dates:"วันที่",hours:"เวลา",until:"ประกาศบูธถึงวันที่"};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// drafts: {p:{id:{field:value}}, shop:{field:value}, added:[{...}]} — kept in this browser only, it is a mock
let D = {p:{}, shop:{}, added:[]};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.p) D = s; } catch(_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(_) {} };
const uploads = {};   // new photos picked in this visit: name -> object URL
let cur = LIVE[3].id, open = false, sent = false;

const live = id => LIVE.find(p => p.id === id);
const val = (id, f) => (D.p[id] && f in D.p[id]) ? D.p[id][f] : live(id)[f];
const shopVal = f => f in D.shop ? D.shop[f] : SHOP[f];
function setVal(id, f, v){ D.p[id] = D.p[id] || {}; if (same(v, live(id)[f])) delete D.p[id][f]; else D.p[id][f] = v; if (!Object.keys(D.p[id]).length) delete D.p[id]; save(); refresh(); }
function setShop(f, v){ if (same(v, SHOP[f])) delete D.shop[f]; else D.shop[f] = v; save(); refresh(); }
const thumb = ph => uploads[ph] || `thumbs/${ph}.jpg`;

function bannedIn(text){
  const t = String(text).toLowerCase().replaceAll("ไม่ใช่ภาชนะใส่อาหาร", "");
  return BANNED.filter(b => t.includes(b[0].toLowerCase()));
}
// problems that stop a send; tips are only advice
function problems(id){
  const out = [], name = val(id,"name"), price = val(id,"price"), lead = val(id,"lead"), seo = val(id,"seo");
  if (!name.trim() || name.length > 40) out.push(["name","ชื่อต้องมี 1–40 ตัวอักษร"]);
  if (!Number.isInteger(price) || price < 1 || price > 9999) out.push(["price","ราคาเป็นบาทเต็ม 1–9,999"]);
  if (lead.length > 160) out.push(["lead",`ยาวเกิน 160 ตัวอักษร (ตอนนี้ ${lead.length})`]);
  if (!seo.trim()) out.push(["seo","ใส่ชื่อสำหรับค้นหา"]);
  if (!val(id,"photos").length) out.push(["photos","ต้องมีรูปอย่างน้อย 1 รูป"]);
  for (const f of ["name","lead","seo","size"]) for (const b of bannedIn(val(id,f))) out.push([f,`ใช้คำว่า "${b[0]}" ไม่ได้ (${b[1]})`]);
  val(id,"uses").forEach(u => bannedIn(u).forEach(b => out.push(["uses",`ใช้คำว่า "${b[0]}" ไม่ได้ (${b[1]})`])));
  return out;
}
function shopProblems(){
  const out = [], s = shopVal("shopee");
  if (s && !/^https:\/\/(shopee\.co\.th|s\.shopee\.co\.th)\//.test(s)) out.push(["shopee","ลิงก์ต้องขึ้นต้นด้วย https://shopee.co.th/"]);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(shopVal("until"))) out.push(["until","เลือกวันที่"]);
  return out;
}

// re-render on change, but keep the caret: the editor redraws only on blur/change, inputs save on input
function keepFocus(fn){ const a = document.activeElement, id = a && a.id, s = a && a.selectionStart; fn(); if (id){ const el = document.getElementById(id); if (el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(s,s); }catch(_){} } } }
function tab(t){ document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab===t))); ["products","shop","send"].forEach(v => $("#v-"+v).hidden = v!==t); scrollTo({top:0}); refresh(); }
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,2200); }

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) return tab(t.dataset.tab);
  if (t.dataset.open){ cur = t.dataset.open; open = true; $("#shopgrid").classList.add("open"); renderEditor(); renderList(); if (innerWidth < 900) scrollTo({top:0}); return; }
  if (t.dataset.back){ open = false; $("#shopgrid").classList.remove("open"); refresh(); return; }
  if (t.dataset.new) return newForm();
  if (t.dataset.unadd){ D.added.splice(+t.dataset.unadd,1); save(); refresh(); return; }
  if (t.dataset.s) return setVal(cur, "status", t.dataset.s);
  if (t.dataset.reset) return setVal(cur, t.dataset.reset, live(cur)[t.dataset.reset]);
  if (t.dataset.sreset) return setShop(t.dataset.sreset, SHOP[t.dataset.sreset]);
  if (t.dataset.mv){ const a=[...val(cur,"photos")], i=+t.dataset.mv, j=i+(+t.dataset.d); [a[i],a[j]]=[a[j],a[i]]; return setVal(cur,"photos",a); }
  if (t.dataset.rm){ const a=[...val(cur,"photos")]; a.splice(+t.dataset.rm,1); return setVal(cur,"photos",a); }
  if (t.dataset.send){ sent = true; refresh(); toast("ส่งแล้ว (ตัวอย่าง)"); return; }
  if (t.dataset.again){ sent = false; refresh(); return; }
  if (t.dataset.clear){ D = {p:{}, shop:{}, added:[]}; save(); refresh(); toast("ล้างร่างแล้ว"); return; }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.in){ const f = el.dataset.in; const v = f==="price" ? (el.value===""?0:Number(el.value)) : el.value; keepFocus(() => setVal(cur, f, v)); }
  else if (el.dataset.use){ const a=[...val(cur,"uses")]; a[+el.dataset.use]=el.value; keepFocus(() => setVal(cur,"uses",a)); }
  else if (el.dataset.shop){ keepFocus(() => setShop(el.dataset.shop, el.value)); }
});

  const bad = bannedIn(name)[0];
  if (!name || !Number.isInteger(price) || price < 1){ err.hidden=false; err.textContent="ใส่ชื่อและราคาเป็นบาทเต็ม"; return; }
  if (bad){ err.hidden=false; err.textContent=`ใช้คำว่า "${bad[0]}" ไม่ได้ (${bad[1]})`; return; }
  D.added.push({name, price, code, photo: !!$("#n-photo").files[0]}); save(); open=false; $("#shopgrid").classList.remove("open"); $("#editor").innerHTML=""; refresh(); toast("เพิ่มในรายการที่จะส่งแล้ว");
});
refresh();
</script>
