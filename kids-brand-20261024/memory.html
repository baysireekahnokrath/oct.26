<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>เกมจับคู่แพตเทิร์น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&family=Jost:wght@500&display=swap">
<link rel="stylesheet" href="kids.css">
<script src="kit.js"></script>
<style>
.game{background:var(--ink);color:var(--paper);border-radius:24px;padding:18px max(16px,3vw) 22px;display:grid;gap:14px}
.game h1{color:var(--paper);font-size:clamp(1.6rem,5vw,2.2rem)}
.hud{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--num);font-variant-numeric:tabular-nums}
.hud b{font-size:1.4rem;color:var(--sun)}
.hud button{margin-left:auto}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.levels button{background:transparent;color:var(--paper);border:2px solid var(--paper);padding:5px 14px}
.levels button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px}
@media (max-width:460px){.board{grid-template-columns:repeat(3,1fr)}}
.card{aspect-ratio:3/4;border:0;padding:0;border-radius:14px;background:transparent;position:relative;cursor:pointer}
.card .face{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .35s}
.card .back{background:var(--indigo);color:var(--paper);font-family:var(--play);font-weight:700;font-size:1.3rem}
.card .front{background:var(--paper);transform:rotateY(180deg);align-content:center;gap:2px}
.card .front svg{width:66%;height:auto}
.card .front i{font-style:normal;font-family:var(--num);font-size:.85rem;color:var(--ink)}
.card.open .back{transform:rotateY(180deg)} .card.open .front{transform:rotateY(360deg)}
.card.done{cursor:default} .card.done .front{background:var(--sun-soft)}
.win{background:var(--sun);color:var(--ink);border-radius:14px;padding:12px 16px;font-family:var(--play);font-weight:700}
</style></head>
<body><div class="wrap">
  <nav class="nav" aria-label="หน้าในแบรนด์เด็ก"><a class="home" href="index.html" data-brand>บีสาม</a><a href="memory.html" aria-current="page">เกมจับคู่</a><a href="decorate.html">แต่งชิ้นหนัง</a><a href="stories.html">นิทาน</a><a href="parents.html">สำหรับพ่อแม่</a></nav>
  <section class="game" aria-labelledby="g-title">
    <h1 id="g-title">เกมจับคู่แพตเทิร์น</h1>
    <p>พลิกการ์ดทีละ 2 ใบ หาคู่ที่เป็นรูปเดียวกัน ระดับง่ายมีแค่รูปร่าง ระดับยากมีตัวละครปนด้วย</p>
    <div class="levels" role="group" aria-label="ระดับ"><button type="button" data-level="easy" aria-pressed="true">ง่าย 6 คู่</button><button type="button" data-level="hard" aria-pressed="false">ยาก 9 คู่</button></div>
    <div class="hud" aria-live="polite"><span>พลิก <b id="moves">0</b></span><span>คู่ <b id="pairs">0</b>/<span id="total">6</span></span><span>ดีที่สุด <b id="best">–</b></span><button id="again" type="button">เริ่มใหม่</button></div>
    <div class="board" id="board"></div>
    <div class="win" id="win" hidden></div>
  </section>
  <p class="muted">เกมนี้ไม่เก็บข้อมูลอะไร สถิติดีที่สุดจำไว้แค่ในเครื่องที่เล่น</p>
</div>
<script>
// Cards come from the kit: six real patterns, plus the three characters on the hard level.
const DEF = {"01":"#B07A4A","02":"#A9442B","07":"#5E7A3A"};
KIT.DATA.characters.forEach(c => { if (!DEF[c.pattern]) DEF[c.pattern] = c.color; });
["03","04","05"].forEach(k => DEF[k] = DEF[k] || "#B07A4A");
document.querySelectorAll("[data-brand]").forEach(a => a.textContent = KIT.DATA.brand.th);
const art = key => key.startsWith("c:")
  ? (c => `<svg viewBox="${KIT.viewBox(c.pattern)}">${KIT.character(c.id)}</svg><i>${c.name}</i>`)(KIT.char(key.slice(2)))
  : `<svg viewBox="${KIT.viewBox(key)}">${KIT.shape(key, DEF[key])}</svg><i>${key}</i>`;
const $ = id => document.getElementById(id);
let level = "easy", open = [], moves = 0, pairs = 0, total = 6, lock = false;
const key = () => "b3-best-" + level;
function readBest(){ try { return Number(localStorage.getItem(key())) || null } catch { return null } }
function saveBest(v){ try { localStorage.setItem(key(), String(v)) } catch {} }
function start(){
  let set = Object.keys(KIT.PATTERNS);
  if (level === "hard") set = set.concat(KIT.DATA.characters.map(c => "c:" + c.id));
  total = set.length;
  const deck = [...set, ...set];
  for (let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  open = []; moves = 0; pairs = 0; lock = false;
  $("moves").textContent = 0; $("pairs").textContent = 0; $("total").textContent = total; $("win").hidden = true;
  const b = readBest(); $("best").textContent = b ?? "–";
  $("board").innerHTML = deck.map((k, i) => `<button class="card" type="button" data-k="${k}" aria-label="การ์ดคว่ำ ใบที่ ${i+1}">
    <span class="face back" aria-hidden="true">${KIT.DATA.brand.en}</span><span class="face front" aria-hidden="true">${art(k)}</span></button>`).join("");
}
$("board").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card || lock || card.classList.contains("open")) return;
  card.classList.add("open"); card.setAttribute("aria-label", "เปิดแล้ว " + card.dataset.k.replace("c:", ""));
  open.push(card);
  if (open.length < 2) return;
  moves++; $("moves").textContent = moves;
  const [a, b] = open;
  if (a.dataset.k === b.dataset.k){
    a.classList.add("done"); b.classList.add("done"); open = []; pairs++; $("pairs").textContent = pairs;
    if (pairs === total){
      const best = readBest(); if (!best || moves < best){ saveBest(moves); $("best").textContent = moves; }
      $("win").hidden = false; $("win").textContent = `เก่งมาก ครบ ${total} คู่ใน ${moves} ครั้ง`;
    }
  } else {
    lock = true;
    setTimeout(() => { [a, b].forEach(c => { c.classList.remove("open"); c.setAttribute("aria-label", "การ์ดคว่ำ"); }); open = []; lock = false; }, 800);
  }
});
document.querySelectorAll("[data-level]").forEach(btn => btn.addEventListener("click", () => {
  level = btn.dataset.level;
  document.querySelectorAll("[data-level]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  start();
}));
$("again").addEventListener("click", start);
start();
</script>
</body></html>
